<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LotR TCG — Board Layout Editor v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0e;font-family:Georgia,serif;overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column;}

/* ── TOP BAR (minimal) ── */
#topbar{height:36px;background:#08080f;border-bottom:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;z-index:200;}
#topbar h1{font-size:11px;color:rgba(186,140,30,0.85);letter-spacing:2px;margin-right:8px;white-space:nowrap;}
.tb-btn{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.12);border-radius:3px;color:rgba(255,255,255,0.55);font-size:10px;padding:3px 9px;cursor:pointer;font-family:Georgia,serif;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.tb-btn:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.9);}
.tb-btn.active{background:rgba(186,140,30,0.18);border-color:rgba(186,140,30,0.5);color:rgba(186,140,30,0.9);}
.tb-btn.gold{border-color:rgba(186,140,30,0.4);color:rgba(186,140,30,0.75);}
.tb-btn.gold:hover{background:rgba(186,140,30,0.12);}
.tb-sep{width:0.5px;height:18px;background:rgba(255,255,255,0.08);margin:0 2px;flex-shrink:0;}
.tb-check{display:flex;align-items:center;gap:3px;font-size:9px;color:rgba(255,255,255,0.4);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:Georgia,serif;}
.tb-check input{accent-color:rgba(186,140,30,0.8);margin:0;}
.tb-label{font-size:9px;color:rgba(255,255,255,0.25);white-space:nowrap;flex-shrink:0;}
#status-msg{font-size:9px;color:rgba(255,255,255,0.22);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── MAIN LAYOUT ── */
#main{flex:1;display:flex;overflow:hidden;position:relative;}

/* ── CHECKLIST FLY-OUT (left) ── */
#checklist-trigger{position:absolute;left:0;top:0;bottom:0;width:24px;z-index:150;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(186,140,30,0.04);border-right:1px solid rgba(186,140,30,0.08);transition:background .2s;}
#checklist-trigger:hover{background:rgba(186,140,30,0.1);}
#checklist-trigger .trigger-label{writing-mode:vertical-rl;text-orientation:mixed;font-size:9px;color:rgba(186,140,30,0.45);letter-spacing:2px;transform:rotate(180deg);}
#checklist-panel{position:absolute;left:24px;top:0;bottom:0;width:280px;background:#090912;border-right:0.5px solid rgba(255,255,255,0.1);z-index:140;display:flex;flex-direction:column;overflow:hidden;transform:translateX(-304px);transition:transform .25s ease;pointer-events:none;box-shadow:4px 0 20px rgba(0,0,0,0.5);}
#checklist-panel.open{transform:translateX(0);pointer-events:all;}
#checklist-header{padding:10px 12px 8px;border-bottom:0.5px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:8px;}
#checklist-header h2{font-size:10px;color:rgba(186,140,30,0.75);letter-spacing:1.5px;flex:1;}
#checklist-stats{font-size:9px;color:rgba(255,255,255,0.25);}
#checklist-body{flex:1;overflow-y:auto;padding:4px 0;}
.cl-category{font-size:8px;color:rgba(186,140,30,0.5);letter-spacing:1.2px;padding:10px 12px 4px;border-bottom:0.5px solid rgba(186,140,30,0.1);}
.cl-item{display:flex;align-items:center;padding:5px 12px;gap:8px;cursor:pointer;transition:background .1s;user-select:none;}
.cl-item:hover{background:rgba(255,255,255,0.04);}
.cl-item.placed .cl-status{background:rgba(80,200,120,0.7);border-color:rgba(80,200,120,0.3);}
.cl-status{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);flex-shrink:0;transition:all .2s;}
.cl-name{font-size:10px;color:rgba(255,255,255,0.55);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cl-item.placed .cl-name{color:rgba(80,200,120,0.7);}
.cl-type-badge{font-size:7px;color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:2px;padding:1px 5px;flex-shrink:0;letter-spacing:0.5px;}

/* ── LAYERS PANEL (right) ── */
#right-trigger{position:absolute;right:0;top:0;bottom:0;width:24px;z-index:150;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(186,140,30,0.04);border-left:1px solid rgba(186,140,30,0.08);transition:background .2s;}
#right-trigger:hover{background:rgba(186,140,30,0.1);}
#right-trigger .trigger-label{writing-mode:vertical-rl;text-orientation:mixed;font-size:9px;color:rgba(186,140,30,0.45);letter-spacing:2px;}
#right-panels{position:absolute;right:24px;top:0;bottom:0;display:flex;flex-shrink:0;z-index:140;transform:translateX(340px);transition:transform .25s ease;pointer-events:none;box-shadow:-4px 0 20px rgba(0,0,0,0.5);}
#right-panels.open{transform:translateX(0);pointer-events:all;}
#right-panels.collapsed{width:0!important;overflow:hidden;opacity:0;pointer-events:none;}
#layers-panel{width:160px;background:#090912;border-left:0.5px solid rgba(255,255,255,0.07);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;}
#layers-title{font-size:9px;color:rgba(186,140,30,0.7);letter-spacing:1.5px;padding:7px 10px 5px;border-bottom:0.5px solid rgba(255,255,255,0.06);}
#layers-list{flex:1;overflow-y:auto;padding:4px 0;}
.layer-group{border-bottom:0.5px solid rgba(255,255,255,0.04);}
.layer-header{display:flex;align-items:center;padding:5px 8px;cursor:pointer;gap:4px;transition:background .1s;}
.layer-header:hover{background:rgba(255,255,255,0.03);}
.layer-vis{width:13px;height:13px;border:0.5px solid rgba(255,255,255,0.18);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:7px;color:rgba(255,255,255,0.55);}
.layer-vis.hidden{opacity:0.25;}
.layer-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.layer-name{font-size:10px;color:rgba(255,255,255,0.55);flex:1;}
.layer-caret{font-size:8px;color:rgba(255,255,255,0.2);}
.layer-items{padding:0 0 2px 18px;}
.comp-row{display:flex;align-items:center;padding:3px 8px;cursor:pointer;gap:4px;border-radius:2px;}
.comp-row:hover{background:rgba(255,255,255,0.03);}
.comp-row.selected{background:rgba(186,140,30,0.1);}
.comp-vis{width:11px;height:11px;border:0.5px solid rgba(255,255,255,0.14);border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:6px;color:rgba(255,255,255,0.45);}
.comp-vis.hidden{opacity:0.2;}
.comp-name{font-size:9px;color:rgba(255,255,255,0.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.comp-row.selected .comp-name{color:rgba(186,140,30,0.8);}

/* ── PROPERTIES PANEL (far right) ── */
#props-panel{width:175px;background:#090912;border-left:0.5px solid rgba(255,255,255,0.07);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;}
#props-title{font-size:9px;color:rgba(186,140,30,0.7);letter-spacing:1.5px;padding:7px 10px 5px;border-bottom:0.5px solid rgba(255,255,255,0.06);}
#props-body{flex:1;overflow-y:auto;padding:8px;}
.prop-row{margin-bottom:7px;}
.prop-section{font-size:8px;color:rgba(186,140,30,0.5);letter-spacing:1px;margin:10px 0 5px;padding-bottom:3px;border-bottom:0.5px solid rgba(186,140,30,0.15);}
.prop-label{font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:0.7px;margin-bottom:3px;}
.prop-input{width:100%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:3px;color:rgba(255,255,255,0.7);font-size:10px;padding:3px 6px;font-family:Georgia,serif;}
.prop-input:focus{outline:none;border-color:rgba(186,140,30,0.45);}
.prop-slider{width:100%;accent-color:rgba(186,140,30,0.8);height:3px;}
.prop-row-2{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.prop-note{font-size:8px;color:rgba(255,255,255,0.18);line-height:1.5;margin-top:6px;}
.prop-btn{width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:3px;color:rgba(255,255,255,0.45);font-size:9px;padding:4px;cursor:pointer;font-family:Georgia,serif;margin-bottom:4px;text-align:center;}
.prop-btn:hover{background:rgba(255,255,255,0.09);color:rgba(255,255,255,0.8);}
.prop-btn.danger{border-color:rgba(200,50,50,0.35);color:rgba(200,100,100,0.55);}
.prop-btn.danger:hover{background:rgba(200,50,50,0.12);color:rgba(220,100,100,0.9);}
.prop-val-row{display:flex;align-items:center;gap:5px;}
.prop-val{font-size:10px;color:rgba(186,140,30,0.7);min-width:28px;text-align:right;}
.toggle-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;cursor:pointer;}
.toggle-row input{accent-color:rgba(186,140,30,0.8);}
.toggle-row span{font-size:9px;color:rgba(255,255,255,0.4);}

/* ── FULL VIEW MODE ── */
body.full-view #topbar,
body.full-view #checklist-trigger,
body.full-view #checklist-panel,
body.full-view #right-trigger,
body.full-view #right-panels,
body.full-view #hover-tooltip,
body.full-view #ctx-menu,
body.full-view #master-modal,
body.full-view .rh,
body.full-view .rotate-handle,
body.full-view #horizon-line,
body.full-view #grid-overlay,
body.full-view #vanish-point,
body.full-view #neg-space-canvas{display:none!important;}
body.full-view #board-wrap{padding:0;background:#000;}
body.full-view #board{cursor:default;}
body.full-view .comp{outline:none!important;box-shadow:none!important;}
body.full-view .comp.selected{outline:none!important;}
body.full-view .comp-inner-label{display:none!important;}
body.full-view #full-view-exit{display:flex;}
#full-view-exit{display:none;position:fixed;top:12px;right:12px;z-index:10000;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:rgba(255,255,255,0.5);font-size:10px;padding:4px 10px;cursor:pointer;font-family:Georgia,serif;align-items:center;gap:4px;transition:opacity .2s;}
#full-view-exit:hover{color:rgba(255,255,255,0.9);border-color:rgba(255,255,255,0.3);}

/* ── BOARD WRAP ── */
#board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 34px 10px 34px;overflow:hidden;background:#0a0a0e;position:relative;}
#board-outer{position:relative;transform-style:preserve-3d;transition:transform 0.3s ease;}
#board{position:relative;background:#2c2c2c;overflow:hidden;cursor:default;flex-shrink:0;}
#bg-landscape{position:absolute;inset:0;pointer-events:none;z-index:0;}
#horizon-line{position:absolute;left:0;right:0;height:1px;cursor:ns-resize;z-index:8;pointer-events:all;}
#horizon-line .hl-line{height:0.5px;background:rgba(186,140,30,0.4);position:absolute;left:0;right:0;}
#horizon-line .hl-label{position:absolute;right:6px;top:-9px;font-size:8px;color:rgba(186,140,30,0.45);letter-spacing:1px;font-family:Georgia,serif;white-space:nowrap;}
#horizon-line .hl-drag{position:absolute;left:0;right:0;top:-5px;height:11px;cursor:ns-resize;}
#horizon-line.hidden-horizon{display:none;}
#grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:7;display:none;}
#grid-overlay.visible{display:block;}
#negspace-canvas{position:absolute;inset:0;pointer-events:none;z-index:600;}

/* ── COMPONENTS ── */
.comp{position:absolute;cursor:move;user-select:none;transform-origin:center center;}
.comp.locked{cursor:default;}
.comp.locked .rh{display:none!important;}
.comp.locked::after{content:'🔒';position:absolute;top:-8px;right:-8px;font-size:10px;z-index:800;filter:drop-shadow(0 0 2px rgba(0,0,0,0.8));pointer-events:none;}
.comp-inner{position:absolute;inset:0;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:visible;}
.comp-inner-label{font-size:11px;font-family:Georgia,serif;text-align:center;line-height:1.4;pointer-events:none;padding:3px;text-shadow:0 0 6px rgba(0,0,0,0.8);}
.comp.selected>.comp-inner{outline:1.5px solid rgba(186,140,30,0.85);outline-offset:0px;}
.comp.hidden>.comp-inner{opacity:0.1;}
.rh{display:none;position:absolute;width:8px;height:8px;background:rgba(186,140,30,0.85);border:0.5px solid rgba(0,0,0,0.5);border-radius:1px;z-index:700;}
.comp.selected .rh{display:block;}
.rh-tl{top:-4px;left:-4px;cursor:nw-resize;}
.rh-tm{top:-4px;left:calc(50% - 4px);cursor:n-resize;}
.rh-tr{top:-4px;right:-4px;cursor:ne-resize;}
.rh-ml{top:calc(50% - 4px);left:-4px;cursor:w-resize;}
.rh-mr{top:calc(50% - 4px);right:-4px;cursor:e-resize;}
.rh-bl{bottom:-4px;left:-4px;cursor:sw-resize;}
.rh-bm{bottom:-4px;left:calc(50% - 4px);cursor:s-resize;}
.rh-br{bottom:-4px;right:-4px;cursor:se-resize;}
.rotate-handle{display:none;position:absolute;width:10px;height:10px;background:rgba(100,180,255,0.8);border:0.5px solid rgba(0,0,0,0.5);border-radius:50%;z-index:700;top:-18px;left:calc(50% - 5px);cursor:crosshair;}
.comp.selected .rotate-handle{display:block;}

/* ── CONTEXT MENU ── */
#ctx-menu{position:fixed;z-index:9000;background:#0f0f1a;border:0.5px solid rgba(186,140,30,0.3);border-radius:5px;min-width:180px;padding:4px 0;display:none;box-shadow:0 6px 24px rgba(0,0,0,0.7),0 0 1px rgba(186,140,30,0.2);font-family:Georgia,serif;}
#ctx-menu.show{display:block;}
.ctx-item{padding:6px 14px;font-size:10px;color:rgba(255,255,255,0.6);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s;}
.ctx-item:hover{background:rgba(186,140,30,0.12);color:rgba(255,255,255,0.9);}
.ctx-item.danger:hover{background:rgba(200,50,50,0.15);color:rgba(200,100,100,0.9);}
.ctx-item .ctx-key{margin-left:auto;font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:0.5px;}
.ctx-sep{height:0.5px;background:rgba(255,255,255,0.06);margin:3px 0;}
.ctx-submenu{position:relative;}
.ctx-submenu>.ctx-sub-items{position:fixed;background:#0f0f1a;border:0.5px solid rgba(186,140,30,0.3);border-radius:5px;min-width:140px;padding:4px 0;display:none;box-shadow:0 6px 24px rgba(0,0,0,0.7);}
.ctx-item .ctx-arrow{margin-left:auto;font-size:8px;color:rgba(255,255,255,0.2);}
.ctx-slider-row{padding:4px 14px 6px;display:flex;align-items:center;gap:6px;}
.ctx-slider-row label{font-size:9px;color:rgba(255,255,255,0.4);min-width:48px;}
.ctx-slider-row input[type=range]{flex:1;accent-color:rgba(186,140,30,0.8);height:3px;}
.ctx-slider-row span{font-size:9px;color:rgba(186,140,30,0.6);min-width:28px;text-align:right;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}

/* ── ANIMATIONS ── */
@keyframes ringspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes negspace-pulse{0%,100%{opacity:0.18}50%{opacity:0.28}}
@keyframes baradur-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.negspace-active{animation:negspace-pulse 3s ease-in-out infinite;}

/* ── HOVER TOOLTIP ── */
#hover-tooltip{position:fixed;z-index:10000;background:#0f0f1a;border:0.5px solid rgba(186,140,30,0.4);border-radius:4px;padding:6px 10px;pointer-events:none;display:none;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,0.7);font-family:Georgia,serif;}
#hover-tooltip.visible{display:block;}
.ht-name{font-size:10px;color:rgba(186,140,30,0.9);margin-bottom:3px;font-weight:bold;}
.ht-row{font-size:8px;color:rgba(255,255,255,0.4);line-height:1.6;}
.ht-val{color:rgba(255,255,255,0.65);}

/* ── MASTER LIST MODAL ── */
#master-modal{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;}
#master-modal.visible{display:flex;}
#master-inner{background:#0a0a14;border:0.5px solid rgba(186,140,30,0.3);border-radius:8px;width:700px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,0.8);}
#master-header{display:flex;align-items:center;padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08);}
#master-header h2{font-size:12px;color:rgba(186,140,30,0.85);letter-spacing:2px;flex:1;font-family:Georgia,serif;}
#master-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:16px;cursor:pointer;padding:4px 8px;}
#master-close:hover{color:rgba(255,255,255,0.8);}
#master-body{flex:1;overflow-y:auto;padding:8px 0;}
.ml-category{font-size:8px;color:rgba(186,140,30,0.55);letter-spacing:1.5px;padding:12px 16px 4px;border-bottom:0.5px solid rgba(186,140,30,0.1);}
.ml-item{display:flex;align-items:center;padding:6px 16px;gap:10px;transition:background .1s;cursor:default;}
.ml-item:hover{background:rgba(255,255,255,0.03);}
.ml-check{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;}
.ml-check.placed{background:rgba(80,200,120,0.15);border-color:rgba(80,200,120,0.5);color:rgba(80,200,120,0.9);}
.ml-check.missing{background:rgba(200,80,50,0.1);border-color:rgba(200,80,50,0.35);}
.ml-check.nonboard{background:rgba(100,150,255,0.1);border-color:rgba(100,150,255,0.3);color:rgba(100,150,255,0.7);}
.ml-name{font-size:10px;color:rgba(255,255,255,0.6);flex:1;}
.ml-desc{font-size:8px;color:rgba(255,255,255,0.25);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-type{font-size:7px;color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:2px;padding:1px 5px;flex-shrink:0;}
.ml-item.has-warning .ml-name{color:rgba(200,160,50,0.75);}

/* ── WARNING BADGE ── */
.warning-badge{background:rgba(200,80,50,0.7);color:#fff;font-size:8px;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-family:Georgia,serif;cursor:pointer;transition:all .2s;flex-shrink:0;}
.warning-badge:hover{background:rgba(200,80,50,0.9);}
.warning-badge.zero{background:rgba(80,200,120,0.25);color:rgba(80,200,120,0.8);}

/* ── SHAPE CLIP PATHS ── */
.shape-circle>.comp-inner{border-radius:50%!important;}
.shape-triangle>.comp-inner{clip-path:polygon(50% 0%,100% 100%,0% 100%)!important;border-radius:0!important;}
.shape-diamond>.comp-inner{clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)!important;border-radius:0!important;}
.shape-hexagon>.comp-inner{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)!important;border-radius:0!important;}
.shape-arc>.comp-inner{border-radius:100% 0 0 0!important;overflow:hidden!important;}
.shape-pentagon>.comp-inner{clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%)!important;border-radius:0!important;}
.shape-quarter-bl>.comp-inner{border-radius:0 0 0 100%!important;overflow:hidden!important;}
.shape-quarter-br>.comp-inner{border-radius:0 0 100% 0!important;overflow:hidden!important;}
.shape-quarter-tl>.comp-inner{border-radius:100% 0 0 0!important;overflow:hidden!important;}
.shape-arc-wide-up>.comp-inner{clip-path:url(#arc-wide-up)!important;border-radius:0!important;overflow:hidden!important;}
.shape-arc-wide-down>.comp-inner{clip-path:url(#arc-wide-down)!important;border-radius:0!important;overflow:hidden!important;}
.shape-arc-band-tl>.comp-inner{clip-path:url(#arc-band-tl)!important;border-radius:0!important;overflow:hidden!important;}
.shape-arc-band-tr>.comp-inner{clip-path:url(#arc-band-tr)!important;border-radius:0!important;overflow:hidden!important;}
.shape-arc-band-bl>.comp-inner{clip-path:url(#arc-band-bl)!important;border-radius:0!important;overflow:hidden!important;}

  <button class="tb-btn" onclick="importJSON()" title="Open a layout file">📂 Load</button>

  <label class="tb-check" title="Horizon line"><input type="checkbox" checked onchange="state.showHorizon=this.checked;renderHorizonLine();"> Horizon</label>

  <div class="tb-sep"></div>

  <label class="tb-check" title="Snap edges to other components (hold Alt to temporarily disable)"><input type="checkbox" checked onchange="state.snapEnabled=this.checked;"> Snap</label>
  <div class="tb-sep"></div>
  <div class="tb-sep"></div>
  <button class="tb-btn gold" onclick="enterFullView()" title="Preview as it would appear in-game — no editor chrome, exact zoom. Press Escape to exit.">Full View</button>

</div>

          <div class="hl-drag"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="right-trigger" onmouseenter="document.getElementById('right-panels').classList.add('open')" onmouseleave="if(!document.getElementById('right-panels').matches(':hover'))document.getElementById('right-panels').classList.remove('open')">

  </div>

// Generate arc band SVG clipPaths (outer arc minus inner arc = band/crescent)
// objectBoundingBox coords: (0,0)=top-left, (1,1)=bottom-right
// Screen-coord angles: 0°=right, 90°=down, 180°=left, 270°=up (clockwise)
(function generateArcBandClipPaths() {
  const defs = document.getElementById('arc-band-defs');
  const N = 40;
  const inner = 0.35; // inner radius fraction (35% cutout = 65% band width)

  // Each corner: circle center + angle sweep for the visible quarter
  const corners = {
    tl: { cx: 0, cy: 0, startA: 0,   endA: 90  }, // right → down
    tr: { cx: 1, cy: 0, startA: 90,  endA: 180 }, // down → left
    bl: { cx: 0, cy: 1, startA: 270, endA: 360 }, // up → right
    br: { cx: 1, cy: 1, startA: 180, endA: 270 }, // left → up
  };

  for (const [corner, cfg] of Object.entries(corners)) {
    const outerPts = [], innerPts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const deg = cfg.startA + t * (cfg.endA - cfg.startA);
      const rad = deg * Math.PI / 180;
      outerPts.push({ x: cfg.cx + Math.cos(rad), y: cfg.cy + Math.sin(rad) });
      innerPts.push({ x: cfg.cx + inner * Math.cos(rad), y: cfg.cy + inner * Math.sin(rad) });
    }
    // Polygon: outer arc forward, inner arc reversed → band shape
    let d = `M ${outerPts[0].x.toFixed(4)} ${outerPts[0].y.toFixed(4)}`;
    for (let i = 1; i <= N; i++) d += ` L ${outerPts[i].x.toFixed(4)} ${outerPts[i].y.toFixed(4)}`;
    for (let i = N; i >= 0; i--) d += ` L ${innerPts[i].x.toFixed(4)} ${innerPts[i].y.toFixed(4)}`;
    d += ' Z';

    const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    clipPath.setAttribute('id', `arc-band-${corner}`);
    clipPath.setAttribute('clipPathUnits', 'objectBoundingBox');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    clipPath.appendChild(path);
    defs.appendChild(clipPath);
  }

  // Wide arcs: ~60° arc segments spanning side to side (curved zone bands)
  // These are NOT corner pieces — they span the full element width as a curved strip.
  // 'up' = concave down (battle line curving toward the viewer)
  // 'down' = concave up (battle line curving away)
  {
    const arcN = 60; // smoothness
    // For a 60° arc: radius = chord / (2*sin(30°)) = chord / 1 = chord
    // Sag = R * (1 - cos(30°)) ≈ 0.134 * chord
    // In objectBoundingBox coords, chord = 1 (full width)
    // We scale the arc sag to fill most of the element height

    // Arc curving UP (outer arc at top, inner arc below it)
    {
      const outerPts = [], innerPts = [];
      for (let i = 0; i <= arcN; i++) {
        const t = i / arcN; // 0..1 across width
        // Parameterize a circular arc: angle from -30° to +30° (60° total)
        const angle = (-30 + t * 60) * Math.PI / 180;
        // Outer arc: R=1 centered below at (0.5, cy), sag normalized to fill top ~40% of element
        const outerSag = 0.35;
        const ox = 0.5 + Math.sin(angle) * 0.5 / Math.sin(30 * Math.PI / 180);
        const oy = outerSag * (1 - Math.cos(angle) / Math.cos(0)) / (1 - Math.cos(30 * Math.PI / 180));
        outerPts.push({ x: Math.max(0, Math.min(1, ox)), y: Math.max(0, Math.min(1, oy)) });
        // Inner arc: same shape offset down
        innerPts.push({ x: Math.max(0, Math.min(1, ox)), y: Math.max(0, Math.min(1, oy + 0.6)) });
      }
      let d = `M ${outerPts[0].x.toFixed(4)} ${outerPts[0].y.toFixed(4)}`;
      for (let i = 1; i <= arcN; i++) d += ` L ${outerPts[i].x.toFixed(4)} ${outerPts[i].y.toFixed(4)}`;
      for (let i = arcN; i >= 0; i--) d += ` L ${innerPts[i].x.toFixed(4)} ${innerPts[i].y.toFixed(4)}`;
      d += ' Z';
      const cp = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      cp.setAttribute('id', 'arc-wide-up'); cp.setAttribute('clipPathUnits', 'objectBoundingBox');
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d);
      cp.appendChild(p); defs.appendChild(cp);
    }

    // Arc curving DOWN (mirror: outer arc at bottom, inner arc above)
    {
      const outerPts = [], innerPts = [];
      for (let i = 0; i <= arcN; i++) {
        const t = i / arcN;
        const angle = (-30 + t * 60) * Math.PI / 180;
        const outerSag = 0.35;
        const ox = 0.5 + Math.sin(angle) * 0.5 / Math.sin(30 * Math.PI / 180);
        const rawY = outerSag * (1 - Math.cos(angle) / Math.cos(0)) / (1 - Math.cos(30 * Math.PI / 180));
        // Flip vertically: 1 - y
        outerPts.push({ x: Math.max(0, Math.min(1, ox)), y: Math.max(0, Math.min(1, 1 - rawY)) });
        innerPts.push({ x: Math.max(0, Math.min(1, ox)), y: Math.max(0, Math.min(1, 1 - rawY - 0.6)) });
      }
      let d = `M ${outerPts[0].x.toFixed(4)} ${outerPts[0].y.toFixed(4)}`;
      for (let i = 1; i <= arcN; i++) d += ` L ${outerPts[i].x.toFixed(4)} ${outerPts[i].y.toFixed(4)}`;
      for (let i = arcN; i >= 0; i--) d += ` L ${innerPts[i].x.toFixed(4)} ${innerPts[i].y.toFixed(4)}`;
      d += ' Z';
      const cp = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      cp.setAttribute('id', 'arc-wide-down'); cp.setAttribute('clipPathUnits', 'objectBoundingBox');
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d);
      cp.appendChild(p); defs.appendChild(cp);
    }
  }

  // Corner brackets: 90° corner with concave arc cutout on inner edge
  // Like a picture frame corner piece with a scooped-out interior
  const cornerBrackets = {
    tl: { corner: [0,0], edge1: [1,0], edge2: [0,1], arcCx: 1, arcCy: 1, startDeg: 270, endDeg: 180 },
    tr: { corner: [1,0], edge1: [1,1], edge2: [0,0], arcCx: 0, arcCy: 1, startDeg: 0,   endDeg: -90 },
    bl: { corner: [0,1], edge1: [0,0], edge2: [1,1], arcCx: 1, arcCy: 0, startDeg: 180, endDeg: 90 },
    br: { corner: [1,1], edge1: [0,1], edge2: [1,0], arcCx: 0, arcCy: 0, startDeg: 90,  endDeg: 0 },
  };

  for (const [id, cfg] of Object.entries(cornerBrackets)) {
    const arcPts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const deg = cfg.startDeg + t * (cfg.endDeg - cfg.startDeg);
      const rad = deg * Math.PI / 180;
      arcPts.push({ x: cfg.arcCx + Math.cos(rad), y: cfg.arcCy + Math.sin(rad) });
    }
    // Path: corner → edge1 → concave arc → edge2 → close
    let d = `M ${cfg.corner[0]} ${cfg.corner[1]}`;
    d += ` L ${cfg.edge1[0]} ${cfg.edge1[1]}`;
    for (let i = 0; i <= N; i++) d += ` L ${arcPts[i].x.toFixed(4)} ${arcPts[i].y.toFixed(4)}`;
    d += ' Z';

    const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    clipPath.setAttribute('id', `corner-${id}`);
    clipPath.setAttribute('clipPathUnits', 'objectBoundingBox');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    clipPath.appendChild(path);
    defs.appendChild(clipPath);
  }
})();

// ═══════════════════════════════════════════════════════════════
// PERSPECTIVE AUTO-LAYOUT — landscape zones become parallelograms
// ═══════════════════════════════════════════════════════════════

// Components that auto-adjust to camera (ground-plane zones ONLY, not UI)
// These are "geography" — they exist on the game board's physical surface
const PERSPECTIVE_COMP_TYPES = new Set([
  'fellowship-zone', 'shadow-zone',
]);

// Layers that are part of the game world geography (affected by perspective/isometric)
// vs UI chrome that must remain fixed-size regardless of camera angle
const GEOGRAPHY_LAYERS = new Set(['landscape', 'shadow', 'neutral', 'fellowship']);
const UI_LAYERS = new Set(['frame', 'interface', 'hand']);

function isCompPerspective(comp) {
  return PERSPECTIVE_COMP_TYPES.has(comp.type);
}

/**
 * Compute a CSS transform string for a landscape component based on camera params.
 * Turns rectangles into perspective-correct parallelograms.
 *
 * The math: components on the "ground plane" converge toward the vanishing point
 * as they approach the horizon. Components near the horizon are narrower (width
 * compression) and skewed more (parallelogram effect). Components near the bottom
 * of the board are closest to the viewer and least affected.
 *
 * Returns { transform, transformOrigin } for CSS application.
 */
/**
 * Compute ONLY the camera/perspective portion of the transform for geography zones.
 * Returns convergence, depth scaling, parallelogram skew, and zoom.
 * Rotation is handled separately in renderComp().
 *
 * IMPORTANT: If the component has manual rotation, perspective is skipped entirely.
 * The perspective math assumes horizontal strips — it produces nonsensical results
 * on rotated zones. Manual rotation = user controls orientation, camera stays out.
 */
function computePerspectiveTransform(comp) {
  // Manual rotation overrides perspective — user is positioning manually
  if (comp.rotation) return { transform: '', transformOrigin: '' };

  const hz = state.horizonY;
  const vx = state.vanishX || 50;
  const tilt = state.boardTiltX || 0;
  const zoom = state.boardZoom || 1.0;

  // No camera effects at all
  if (tilt === 0 && zoom === 1.0) return { transform: '', transformOrigin: '' };

  // Zoom-only (no tilt): just scale geography zones uniformly
  if (tilt === 0) {
    return { transform: `scale(${zoom})`, transformOrigin: '50% 50%' };
  }

  const cx = comp.x + comp.w / 2;
  const effY = getEffectiveY(comp);
  const cy = effY + comp.h / 2;

  const groundRange = Math.max(1, 100 - hz);
  const depthFactor = Math.max(0, Math.min(1, (cy - hz) / groundRange));
  const tiltIntensity = Math.min(1, tilt / 35);

  // Width compression toward horizon
  const minWidthScale = 1 - 0.45 * tiltIntensity;
  const widthScale = minWidthScale + (1 - minWidthScale) * depthFactor;

  // Horizontal convergence toward VP
  const convergenceStrength = (1 - depthFactor) * tiltIntensity * 0.35;
  const shiftX = (vx - cx) * convergenceStrength;

  // Parallelogram skew
  const sideOffset = (cx - vx) / 50;
  const skewDeg = sideOffset * (1 - depthFactor) * tiltIntensity * 12;

  // Vertical compression toward horizon
  const minHeightScale = 1 - 0.3 * tiltIntensity;
  const heightScale = minHeightScale + (1 - minHeightScale) * depthFactor;

  // Apply camera zoom
  const finalWidthScale = widthScale * zoom;
  const finalHeightScale = heightScale * zoom;

  // Build perspective-only transform (NO component rotation — that's handled in renderComp)
  const parts = [];
  if (Math.abs(shiftX) > 0.1) parts.push(`translateX(${shiftX.toFixed(1)}%)`);
  if (Math.abs(finalWidthScale - 1) > 0.005 || Math.abs(finalHeightScale - 1) > 0.005) {
    parts.push(`scale(${finalWidthScale.toFixed(3)}, ${finalHeightScale.toFixed(3)})`);
  }
  if (Math.abs(skewDeg) > 0.1) parts.push(`skewX(${skewDeg.toFixed(1)}deg)`);

  return {
    transform: parts.join(' '),
    transformOrigin: `${((vx - comp.x) / comp.w * 100).toFixed(0)}% 50%`,
  };
}

/**
 * Toggle board perspective between FP and Shadow.
 * Shadow view flips the board: Shadow zone is near (bottom), Fellowship is far (top).
 * The landscape itself mirrors — Shadow player looks from the opposite direction.
 */
function enterFullView() {
  state._savedZoom = state.boardZoom;
  document.body.classList.add('full-view');
  state.selectedIds = [];
  resizeBoard();
  renderAll();
}

function exitFullView() {
  document.body.classList.remove('full-view');
  resizeBoard();
  renderAll();
}

// Perspective mirroring removed — both players see the same board orientation.
// The board layout is designed once and works for both sides.
function getEffectiveY(comp) {
  return comp.y;
}

function saveUndo() {
  state.undoStack.push(JSON.stringify({ components: state.components, groups: state.groups }));
  if (state.undoStack.length > 60) state.undoStack.shift();
  state.redoStack = [];
}

function undo() {
  if (!state.undoStack.length) { setStatus('Nothing to undo.'); return; }
  state.redoStack.push(JSON.stringify({ components: state.components, groups: state.groups }));
  const snapshot = JSON.parse(state.undoStack.pop());
  state.components = snapshot.components || snapshot;
  state.groups = snapshot.groups || [];
  state.selectedIds = [];
  renderAll();
  setStatus('Undone.');
}

function redo() {
  if (!state.redoStack.length) { setStatus('Nothing to redo.'); return; }
  state.undoStack.push(JSON.stringify({ components: state.components, groups: state.groups }));
  const snapshot = JSON.parse(state.redoStack.pop());
  state.components = snapshot.components || snapshot;
  state.groups = snapshot.groups || [];
  state.selectedIds = [];
  renderAll();
  setStatus('Redone.');
}

// BOARD SIZING & TILT
// ═══════════════════════════════════════════════════════════════

const ratios = { '16:9': 16/9, '2:1': 2/1, '16:10': 16/10 };

function resizeBoard() {
  const wrap = document.getElementById('board-wrap');
  const board = document.getElementById('board');
  const ratio = ratios[state.boardRatio] || 16/9;
  const isFullView = document.body.classList.contains('full-view');
  const pad = isFullView ? 0 : 30;
  const ww = wrap.clientWidth - pad;
  const wh = wrap.clientHeight - pad;
  let bw = ww, bh = ww / ratio;
  if (bh > wh) { bh = wh; bw = wh * ratio; }
  board.style.width  = bw + 'px';
  board.style.height = bh + 'px';
  ['16:9','2:1','16:10'].forEach(r => {
    const btn = document.getElementById('btn-' + r.replace(':',''));
    if (btn) btn.classList.toggle('active', r === state.boardRatio);
  });
  applyBoardTilt();
  renderAll();
}

function setBoardRatio(r) { state.boardRatio = r; resizeBoard(); }

function applyBoardTilt() {
  // No CSS transform on the container — it would scale ALL children (UI + geography).
  // Instead, zoom is folded into computePerspectiveTransform() so only geography zones scale.
  // UI chrome (borders, HUD, hand) stays at designed pixel size regardless of camera.
  const outer = document.getElementById('board-outer');
  outer.style.transform = 'none';
  outer.style.perspective = 'none';
  updatePerspectiveZones();
}

function updatePerspectiveZones() {
  state.components.forEach(comp => {
    if (!isCompPerspective(comp)) return;
    const el = document.querySelector(`.comp[data-id="${comp.id}"]`);
    if (!el) return;
    // Rebuild full transform: perspective + component rotation (separated concerns)
    const persp = computePerspectiveTransform(comp);
    const parts = [];
    if (persp.transform) parts.push(persp.transform);
    const rot = comp.rotation || 0, skX = comp.skewX || 0, skY = comp.skewY || 0;
    if (rot) parts.push(`rotate(${rot}deg)`);
    if (skX) parts.push(`skewX(${skX}deg)`);
    if (skY) parts.push(`skewY(${skY}deg)`);
    el.style.transform = parts.length ? parts.join(' ') : 'none';
    if (persp.transformOrigin) el.style.transformOrigin = persp.transformOrigin;
  });
}

function renderVanishPoint() {
  let vp = document.getElementById('vanish-point');
  if (!state.showVanishPoint) { if (vp) vp.style.display = 'none'; return; }
  const board = document.getElementById('board');
  if (!vp) {
    vp = document.createElement('div');
    vp.id = 'vanish-point';
    vp.style.cssText = 'position:absolute;z-index:50;pointer-events:none;';
    board.appendChild(vp);
  }
  const vx = state.vanishX !== undefined ? state.vanishX : 50;
  const vy = state.vanishY !== undefined ? state.vanishY : 50;
  const bp = boardPx();
  const px = vx / 100 * bp.w, py = vy / 100 * bp.h;
  const lineLen = Math.max(bp.w, bp.h) * 1.5;
  vp.style.display = 'block';
  vp.innerHTML = `
    <svg style="position:absolute;left:0;top:0;width:${bp.w}px;height:${bp.h}px;pointer-events:none;overflow:visible;">
      <!-- Convergence lines from corners -->
      <line x1="0" y1="0" x2="${px}" y2="${py}" stroke="rgba(100,180,255,0.15)" stroke-width="0.5" stroke-dasharray="6 4"/>
      <line x1="${bp.w}" y1="0" x2="${px}" y2="${py}" stroke="rgba(100,180,255,0.15)" stroke-width="0.5" stroke-dasharray="6 4"/>
      <line x1="0" y1="${bp.h}" x2="${px}" y2="${py}" stroke="rgba(100,180,255,0.15)" stroke-width="0.5" stroke-dasharray="6 4"/>
      <line x1="${bp.w}" y1="${bp.h}" x2="${px}" y2="${py}" stroke="rgba(100,180,255,0.15)" stroke-width="0.5" stroke-dasharray="6 4"/>
      <!-- Crosshair at vanishing point -->
      <line x1="${px-12}" y1="${py}" x2="${px+12}" y2="${py}" stroke="rgba(100,180,255,0.6)" stroke-width="1"/>
      <line x1="${px}" y1="${py-12}" x2="${px}" y2="${py+12}" stroke="rgba(100,180,255,0.6)" stroke-width="1"/>
      <circle cx="${px}" cy="${py}" r="5" fill="none" stroke="rgba(100,180,255,0.5)" stroke-width="1"/>
      <circle cx="${px}" cy="${py}" r="2" fill="rgba(100,180,255,0.7)"/>
      <text x="${px+10}" y="${py-10}" font-size="8" fill="rgba(100,180,255,0.5)" font-family="Georgia,serif">VP ${vx.toFixed(0)}%, ${vy.toFixed(0)}%</text>
    </svg>`;
}

// ═══════════════════════════════════════════════════════════════
// COORDINATE UTILS
// ═══════════════════════════════════════════════════════════════

function boardPx() {
  const b = document.getElementById('board');
  return { w: b.clientWidth, h: b.clientHeight };
}

function pctToPx(comp) {
  const { w, h } = boardPx();
  return { x: comp.x/100*w, y: comp.y/100*h, w: comp.w/100*w, h: comp.h/100*h };
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════

function renderAll() {
  document.querySelectorAll('.comp').forEach(el => el.remove());
  const layerOrder = state.layers.map(l => l.id);
  const sorted = [...state.components].sort((a, b) => {
    const la = layerOrder.indexOf(a.layer);
    const lb = layerOrder.indexOf(b.layer);
    return la !== lb ? la - lb : (a.zIndex||0) - (b.zIndex||0);
  });
  sorted.forEach(comp => renderComp(comp));
  renderLayerPanel();
  renderPropsPanel();
  renderLandscape();
  renderHorizonLine();
  renderGridOverlay();
  updateNegSpaceCanvas();
  updateChecklistStats();
  updateWarningBadge();
}

function getLayerVisible(layerId) {
  const l = state.layers.find(l => l.id === layerId);
  return l ? l.visible : true;
}

function renderComp(comp) {
  const board = document.getElementById('board');
  const px = pctToPx(comp);
  const layerVis = getLayerVisible(comp.layer);
  const isSelected = state.selectedIds.includes(comp.id);
  const opacity = comp.opacity !== undefined ? comp.opacity : 1;
  const rotation = comp.rotation || 0;
  const skewX = comp.skewX || 0;
  const skewY = comp.skewY || 0;

  const el = document.createElement('div');
  let cls = 'comp';
  if (!comp.visible || !layerVis) cls += ' hidden';
  if (isSelected) cls += ' selected';
  if (state.landscapeMode && !isCompLandscapeRelevant(comp)) cls += ' landscape-dimmed';
  if (comp.shape && comp.shape !== 'rect') cls += ` shape-${comp.shape}`;
  el.className = cls;
  el.dataset.id = comp.id;
  el.style.left   = px.x + 'px';
  el.style.top    = px.y + 'px';
  el.style.width  = px.w + 'px';
  el.style.height = px.h + 'px';
  el.style.opacity = opacity;
  el.style.zIndex  = state.layers.findIndex(l => l.id === comp.layer) * 10 + (comp.zIndex||0) + 1;

  // Locked components show a lock badge and cannot be moved/resized
  if (comp.locked) {
    el.classList.add('locked');
  }

  // Gradient frame overlays (custom type on frame layer) are visual-only — click through
  // Border pieces (border-1 through border-5) are selectable/moveable art elements
  if (comp.layer === 'frame' && comp.type === 'custom') {
    el.style.pointerEvents = 'none';
  }

  // Build transform: perspective (geography only) + rotation/skew (all components)
  // These are independent: perspective is a camera effect, rotation is the component's own orientation.
  let transformParts = [];

  // 1. Perspective (convergence, depth scale, zoom) — geography zones only
  if (isCompPerspective(comp)) {
    const persp = computePerspectiveTransform(comp);
    if (persp.transform) transformParts.push(persp.transform);
    if (persp.transformOrigin) el.style.transformOrigin = persp.transformOrigin;
  }

  // 2. Component's own rotation/skew — ALL components, always
  if (rotation) transformParts.push(`rotate(${rotation}deg)`);
  if (skewX) transformParts.push(`skewX(${skewX}deg)`);
  if (skewY) transformParts.push(`skewY(${skewY}deg)`);

  const transform = transformParts.join(' ');
  if (transform) el.style.transform = transform;

  const inner = document.createElement('div');
  inner.className = 'comp-inner';
  inner.style.background   = comp.bg;
  inner.style.borderRadius = comp.borderRadius || '4px';
  // Cover type visual distinction
  const ct = comp.coverType || 'dynamic';
  if (ct === 'opaque') {
    // Solid fill, solid border — landscape never visible
    inner.style.background = comp.bg;
    if (comp.border && comp.border !== 'none') inner.style.border = '2px solid ' + comp.border;
  } else if (ct === 'dynamic') {
    // Translucent fill + crosshatch overlay, thick solid border
    inner.style.background = 'transparent';
    inner.style.backgroundImage = `linear-gradient(0deg,${comp.bg || 'rgba(0,0,0,0.15)'},${comp.bg || 'rgba(0,0,0,0.15)'}),repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,0.06) 6px,rgba(255,255,255,0.06) 7px),repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(255,255,255,0.06) 6px,rgba(255,255,255,0.06) 7px)`;
    if (comp.border && comp.border !== 'none') inner.style.border = '2px solid ' + comp.border;
  } else if (ct === 'translucent') {
    // Translucent fill, dashed border — landscape always visible
    inner.style.background = comp.bg;
    if (comp.border && comp.border !== 'none') inner.style.border = '1.5px dashed ' + comp.border;
  } else {
    inner.style.background = comp.bg;
    if (comp.border && comp.border !== 'none') inner.style.border = '1.5px ' + (comp.dashed ? 'dashed' : 'solid') + ' ' + comp.border;
  }

  // Visual type styling
  if (comp.visualType === 'banner') {
    inner.style.borderRadius = '2px';
    inner.style.borderBottom = '2px solid ' + (comp.border || 'rgba(186,140,30,0.5)');
  } else if (comp.visualType === 'badge') {
    inner.style.borderRadius = '20px';
    inner.style.padding = '2px 8px';
  } else if (comp.visualType === 'card') {
    inner.style.borderRadius = '6px';
    inner.style.boxShadow = '0 2px 8px rgba(0,0,0,0.4)';
  } else if (comp.visualType === 'panel') {
    inner.style.borderRadius = '0';
    inner.style.borderLeft = '2px solid ' + (comp.border || 'rgba(186,140,30,0.5)');
  }

  // Specialized rendering
  if (comp.type === 'fellowship-zone' || comp.type === 'shadow-zone') {
    const lbl = document.createElement('div'); lbl.className='comp-inner-label'; lbl.style.color=comp.color; lbl.textContent=comp.label; inner.appendChild(lbl);
    inner.insertAdjacentHTML('beforeend', renderZoneCardGrid(comp, px));
  }
  else if (comp.type === 'baradur') { inner.innerHTML = renderBaradur(comp); inner.style.transformOrigin = 'top right'; }
  else if (comp.type === 'hand-fan') {
    inner.innerHTML = renderFanArc(comp, px);
    inner.style.borderRadius = '100% 0 0 0';
    inner.style.overflow = 'hidden';
    inner.style.border = '1.5px solid ' + (comp.border || 'rgba(100,186,130,0.35)');
  }
  else if (comp.type === 'twilight-pool') inner.innerHTML = renderTwilightPool(comp);
  else if (comp.type === 'pass-btn') { inner.innerHTML = `<div style="font-size:9px;color:${comp.color};font-family:Georgia,serif;letter-spacing:1px;">↷ PASS</div>`; inner.style.borderRadius='20px'; }
  else if (comp.type === 'phase-jewel') { inner.innerHTML = renderPhaseJewel(comp); inner.style.borderRadius='12%'; }
  else if (comp.type === 'opp-hand') inner.innerHTML = renderOppHand(comp);
  else if (comp.type === 'ring-spinner') { inner.innerHTML = renderRingSpinner(comp); inner.style.background='transparent'; inner.style.border='none'; }
  else if (comp.isIcon && comp.svgType) inner.innerHTML = renderSVGIcon(comp.svgType, comp.color);
  else if (comp.type === 'toy-arrow') inner.innerHTML = `<div style="width:100%;display:flex;align-items:center;justify-content:center;color:${comp.color};font-size:11px;">→</div>`;
  else if (comp.textContent) { const lbl=document.createElement('div'); lbl.className='comp-inner-label'; lbl.style.color=comp.color; lbl.textContent=comp.textContent||comp.label; inner.appendChild(lbl); }
  else { const lbl=document.createElement('div'); lbl.className='comp-inner-label'; lbl.style.color=comp.color; lbl.textContent=comp.label; inner.appendChild(lbl); }

  el.appendChild(inner);

  // Resize handles
  ['tl','tm','tr','ml','mr','bl','bm','br'].forEach(pos => {
    const h = document.createElement('div');
    h.className = `rh rh-${pos}`;
    h.dataset.handle = pos;
    el.appendChild(h);
  });

  // Rotate handle
  const rh = document.createElement('div');
  rh.className = 'rotate-handle';
  el.appendChild(rh);

  board.appendChild(el);
  attachDrag(el, comp);

  // Hover tooltip
  el.addEventListener('mouseenter', e => showHoverTooltip(comp, e));
  el.addEventListener('mousemove', e => moveHoverTooltip(e));
  el.addEventListener('mouseleave', () => hideHoverTooltip());
}

function renderPhaseJewel(comp) {
  const phases = [
    { name:'Fellowship', color:'#c9a530', symbol:'🛡' },
    { name:'Shadow',     color:'#9b5de5', symbol:'👁' },
    { name:'Maneuver',   color:'#45b7aa', symbol:'♟' },
    { name:'Archery',    color:'#5aad5a', symbol:'🏹' },
    { name:'Assignment', color:'#d4893e', symbol:'⚔' },
    { name:'Skirmish',   color:'#c43c3c', symbol:'🗡' },
    { name:'Regroup',    color:'#b0b8c8', symbol:'✦' },
  ];
  const cx=50, cy=50, r=34, jewelR=5;
  const jewels = phases.map((p,i) => {
    const angle = -90 + (i * 360 / phases.length);
    const rad = angle * Math.PI / 180;
    const x = cx + r * Math.cos(rad);
    const y = cy + r * Math.sin(rad);
    const active = i === 0;
    return `<circle cx="${x}" cy="${y}" r="${jewelR}" fill="${p.color}" opacity="${active?1:0.3}" stroke="${active?'#fff':'none'}" stroke-width="${active?1.5:0}"/>`;
  });
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
    <svg viewBox="0 0 100 100" style="width:90%;height:90%;">
      <circle cx="${cx}" cy="${cy}" r="18" fill="rgba(20,18,30,0.8)" stroke="rgba(160,130,60,0.5)" stroke-width="1"/>
      <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central" fill="${phases[0].color}" font-size="16">${phases[0].symbol}</text>
      ${jewels.join('')}
    </svg>
  </div>`;
}

function renderTwilightPool(comp) {

    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:30px;margin:0 auto;">
      ${[...Array(coins)].map(()=>`<div style="width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(100,160,240,0.75),rgba(10,20,80,0.9));border:0.5px solid rgba(80,140,220,0.55);"></div>`).join('')}
    </div>

}

function renderRingSpinner(comp) {

      <circle cx="11" cy="11" r="4" fill="none" stroke="rgba(186,117,23,0.3)" stroke-width="0.8"/>

function renderBaradur(comp) {
  const b = state.burdens;
  const t = Math.min(b / 12, 1); // 0..1 progression

  // Camera concept:
  // t=0: distant, straight-on, full tower visible, faint
  // t=0.5: mid-range, camera lifting, tower fills more, Eye visible
  // t=1: close-up, camera above, looking down at Eye, tower drops below

  // Overall opacity: faint at start, fully present by mid, intense at end
  const masterOp = 0.25 + t * 0.75;

  // Eye size relative to container: starts tiny (distant), grows to dominate
  const eyeSize = 12 + t * 55; // % of container width
  // Eye vertical position: starts near top, stays top-center as camera lifts
  const eyeY = 8 + t * 15; // % from top

  // Tower body: starts as full thin tower, progressively only lower portion visible
  // as camera lifts above, tower tapers away below the Eye
  const towerTopY = eyeY + eyeSize * 0.35; // tower starts just below eye
  const towerVisible = Math.max(0, 1 - t * 0.6); // less tower visible at high burden
  const towerWidth = 15 + t * 25; // widens as it gets closer
  const towerHeight = (100 - towerTopY) * (0.3 + towerVisible * 0.7); // shrinks from bottom as camera lifts

  // Glow: atmospheric red haze, grows dramatically
  const glowSize = 30 + t * 120;
  const glowIntensity = 0.08 + t * 0.45;

  // Red vignette at high burden
  const vignetteOp = Math.max(0, (t - 0.5) * 0.6);

  // Burden label
  const labelColor = t > 0.7 ? `rgba(255,${Math.round(120 - t*80)},${Math.round(50 - t*40)},0.9)` : 'rgba(200,80,50,0.7)';

  // Screen shake hint at max
  const shake = t > 0.9 ? 'animation: baradur-pulse 1.5s ease-in-out infinite;' : '';

  return `<div style="position:relative;width:100%;height:100%;overflow:visible;opacity:${masterOp};${shake}">
    <!-- Dotted outline: maximum extent at 12 burdens. Growth goes down+left from top-right anchor. -->
    <div style="position:absolute;inset:0;border:1.5px dashed rgba(150,30,30,0.35);border-radius:3px;pointer-events:none;z-index:5;"></div>
    <!-- Atmospheric glow -->
    <div style="position:absolute;top:${eyeY - glowSize*0.3}%;left:50%;transform:translateX(-50%);width:${glowSize}%;height:${glowSize}%;border-radius:50%;background:radial-gradient(ellipse,rgba(180,30,10,${glowIntensity}) 0%,rgba(120,15,5,${glowIntensity*0.4}) 40%,transparent 70%);pointer-events:none;z-index:0;"></div>

    <!-- Tower body — dark spire tapering upward -->
    <div style="position:absolute;top:${towerTopY}%;left:50%;transform:translateX(-50%);width:${towerWidth}%;height:${towerHeight}%;z-index:1;">
      <div style="width:100%;height:100%;background:linear-gradient(180deg,#1a0808 0%,#0d0404 60%,rgba(5,2,2,${0.3+t*0.4}) 100%);clip-path:polygon(${25-t*8}% 0%,${75+t*8}% 0%,${60+t*5}% 100%,${40-t*5}% 100%);border:1px solid rgba(150,30,30,${0.3+t*0.3});"></div>
      <!-- Tower segments / battlements -->
      ${t < 0.7 ? `
        <div style="position:absolute;top:15%;left:20%;right:20%;height:1px;background:rgba(150,30,30,${0.2+t*0.2});"></div>
        <div style="position:absolute;top:40%;left:15%;right:15%;height:1px;background:rgba(150,30,30,${0.15+t*0.15});"></div>
        <div style="position:absolute;top:65%;left:10%;right:10%;height:1px;background:rgba(120,20,20,${0.1+t*0.1});"></div>
      ` : ''}
    </div>

    <!-- The Eye of Sauron -->
    <div style="position:absolute;top:${eyeY}%;left:50%;transform:translate(-50%,-50%);width:${eyeSize}%;height:${eyeSize * 0.55}%;z-index:2;">
      <!-- Outer flame -->
      <div style="position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,80,10,${0.15+t*0.35}) 0%,rgba(200,40,5,${0.1+t*0.2}) 50%,transparent 75%);"></div>
      <!-- Eye slit shape -->
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,160,20,${0.4+t*0.6}) 0%,rgba(220,60,10,${0.3+t*0.5}) 35%,rgba(150,20,5,${0.2+t*0.3}) 60%,transparent 80%);overflow:hidden;">
        <!-- Pupil slit -->
        <div style="position:absolute;top:15%;bottom:15%;left:42%;right:42%;background:rgba(0,0,0,${0.6+t*0.4});border-radius:50%;box-shadow:0 0 ${3+t*8}px rgba(255,100,10,${0.3+t*0.5});"></div>
      </div>
      <!-- Inner fire ring -->
      <div style="position:absolute;inset:10%;border-radius:50%;border:${1+t*2}px solid rgba(255,120,20,${0.2+t*0.5});box-shadow:0 0 ${4+t*12}px rgba(255,80,10,${0.2+t*0.5}),inset 0 0 ${2+t*6}px rgba(255,60,10,${0.15+t*0.3});"></div>
    </div>

    <!-- Red vignette overlay at high burden -->
    ${vignetteOp > 0 ? `<div style="position:absolute;inset:-50%;border-radius:0;background:radial-gradient(ellipse,transparent 30%,rgba(100,10,5,${vignetteOp}) 100%);pointer-events:none;z-index:3;"></div>` : ''}

    <!-- Burden count -->
    <div style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:${7+t*3}px;color:${labelColor};font-family:Georgia,serif;white-space:nowrap;z-index:4;text-shadow:0 0 ${4+t*8}px rgba(200,40,10,${0.3+t*0.5});">${b > 0 ? b + ' burden' + (b!==1?'s':'') : 'no burdens'}</div>
  </div>`;
}

function renderZoneCardGrid(comp, px) {
  const w = px.w, h = px.h;
  const bp = boardPx();

  // ── Absolute standee footprint (fixed real-world size, scaled only by perspective) ──
  const NEAR_BASE_W_PCT = 4.2;  // % of board width at nearest distance
  const BASE_RATIO = 3;          // width:depth

  // ── Perspective depth scaling ──
  const hz = state.horizonY;
  const tilt = state.boardTiltX || 0;
  const tiltIntensity = Math.min(1, tilt / 35);
  const groundRange = Math.max(1, 100 - hz);
  const zoneCenterY = comp.y + comp.h / 2;
  const depthFactor = Math.max(0, Math.min(1, (zoneCenterY - hz) / groundRange));
  const minScale = 1 - 0.45 * tiltIntensity;
  const perspScale = minScale + (1 - minScale) * depthFactor;

  // ── Grid cell size = standee base footprint at this depth ──
  const cellW = bp.w * (NEAR_BASE_W_PCT / 100) * perspScale;
  const cellH = cellW / BASE_RATIO;

  // ── Count how many cells fit ──
  const pad = 2;
  const cols = Math.max(1, Math.floor((w - pad * 2) / cellW));
  const rows = Math.max(1, Math.floor((h - pad * 2) / cellH));
  const total = cols * rows;

  // Center the grid in the zone
  const gridW = cols * cellW, gridH = rows * cellH;
  const offX = (w - gridW) / 2, offY = (h - gridH) / 2;

  const isFP = comp.type === 'fellowship-zone';
  const stroke = isFP ? 'rgba(220,170,40,0.2)' : 'rgba(120,80,180,0.2)';
  const textCol = isFP ? 'rgba(220,170,40,0.4)' : 'rgba(120,80,180,0.4)';

  let svg = '';

  // Draw grid lines
  for (let c = 0; c <= cols; c++) {
    const x = offX + c * cellW;
    svg += `<line x1="${x}" y1="${offY}" x2="${x}" y2="${offY + gridH}" stroke="${stroke}" stroke-width="0.5"/>`;
  }
  for (let r = 0; r <= rows; r++) {
    const y = offY + r * cellH;
    svg += `<line x1="${offX}" y1="${y}" x2="${offX + gridW}" y2="${y}" stroke="${stroke}" stroke-width="0.5"/>`;
  }

  // Stats: cols × rows = total
  const depthLabel = tilt > 0 ? `  depth ${(perspScale * 100).toFixed(0)}%` : '';
  svg += `<text x="${w - 4}" y="${h - 3}" text-anchor="end" font-size="8" font-family="Georgia,serif" fill="${textCol}">${cols}×${rows} = ${total} slots${depthLabel}</text>`;

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;overflow:visible;pointer-events:none;">${svg}</svg>`;
}

function renderFanArc(comp, px) {
  const w = px.w, h = px.h, count = 8;
  // Quarter circle: origin at bottom-right, cards fan toward top-left
  // The zone's CSS border-radius (100% 0 0 0) creates a quarter-ellipse
  // centered at (0,0) from (w,0) to (0,h). The arc must match exactly.
  const tickCount = 8;
  const tickLen = Math.min(w, h) * 0.04;

  let svgContent = '';
  // Arc line tracing the zone's quarter-ellipse boundary
  svgContent += `<path d="M ${w} 0 A ${w} ${h} 0 0 0 0 ${h}" fill="none" stroke="rgba(186,140,30,0.35)" stroke-width="1.5"/>`;
  // Tick marks along the elliptical arc
  for (let i = 0; i < tickCount; i++) {
    const t = i / (tickCount - 1);
    const angle = t * Math.PI / 2; // 0 to π/2
    const cx = w * Math.cos(angle);
    const cy = h * Math.sin(angle);
    // Normal direction (outward from center) for the ellipse
    const nx = Math.cos(angle) / w;
    const ny = Math.sin(angle) / h;
    const nl = Math.sqrt(nx * nx + ny * ny);
    const nnx = nx / nl, nny = ny / nl;
    svgContent += `<line x1="${cx - nnx * tickLen}" y1="${cy - nny * tickLen}" x2="${cx + nnx * tickLen}" y2="${cy + nny * tickLen}" stroke="rgba(186,140,30,0.45)" stroke-width="1.2"/>`;
  }

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;overflow:visible;">${svgContent}</svg>
    <div style="position:absolute;bottom:6px;right:10px;font-size:8px;color:rgba(255,255,255,0.22);font-family:Georgia,serif;text-align:right;line-height:1.4;">your hand</div>`;
}

// ═══════════════════════════════════════════════════════════════
// CANVAS FEATURES (neg space, grid, horizon, landscape)
// ═══════════════════════════════════════════════════════════════

function updateNegSpaceCanvas() {
  const canvas = document.getElementById('negspace-canvas');
  const { w: bw, h: bh } = boardPx();
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, bw, bh);
  if (!state.showNegSpace) return;
  ctx.fillStyle = 'rgba(186, 140, 30, 0.20)';
  ctx.fillRect(0, 0, bw, bh);
  ctx.globalCompositeOperation = 'destination-out';
  state.components.forEach(comp => {
    if (!comp.visible || !getLayerVisible(comp.layer)) return;
    const px = pctToPx(comp);
    const rot=comp.rotation||0, skX=comp.skewX||0, skY=comp.skewY||0;
    const cx=px.x+px.w/2, cy=px.y+px.h/2;
    ctx.save(); ctx.translate(cx,cy);
    if (rot) ctx.rotate(rot*Math.PI/180);
    if (skX) ctx.transform(1,Math.tan(skY*Math.PI/180),Math.tan(skX*Math.PI/180),1,0,0);
    ctx.fillStyle='rgba(0,0,0,1)'; ctx.fillRect(-px.w/2,-px.h/2,px.w,px.h);
    ctx.restore();
  });
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = 'rgba(255,240,180,0.06)';
  ctx.fillRect(0, 0, bw, bh);
  ctx.globalCompositeOperation = 'source-over';
}

function renderHorizonLine() {
  const hl = document.getElementById('horizon-line');
  const { h } = boardPx();
  const topPx = state.horizonY / 100 * h;
  const offScreen = state.horizonY < 0 || state.horizonY > 100;
  hl.className = state.showHorizon ? '' : 'hidden-horizon';

  if (offScreen && state.showHorizon) {
    // Clamp the line to the edge of the board, show indicator
    hl.style.top = (state.horizonY < 0 ? 0 : h) + 'px';
    const lbl = hl.querySelector('.hl-label');
    const arrow = state.horizonY < 0 ? '↑' : '↓';
    if (lbl) lbl.textContent = `${arrow} HORIZON ${state.horizonY.toFixed(0)}% (off-screen)`;
  } else {
    hl.style.top = topPx + 'px';
    const lbl = hl.querySelector('.hl-label');
    if (lbl) lbl.textContent = `HORIZON ${state.horizonY.toFixed(0)}%`;
  }
}

function initHorizonDrag() {
  const drag = document.getElementById('horizon-line').querySelector('.hl-drag');
  let dragging = false;
  drag.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); dragging=true; saveUndo(); });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const board=document.getElementById('board'), rect=board.getBoundingClientRect();
    state.horizonY = Math.max(-100,Math.min(200,(e.clientY-rect.top)/rect.height*100));
    renderHorizonLine();
    updatePerspectiveZones();
    renderPropsPanel();
    if (state.showNegSpace) updateNegSpaceCanvas();
  });
  document.addEventListener('mouseup', () => { dragging=false; });
}

function renderGridOverlay() {
  const svg = document.getElementById('grid-overlay');
  const { w, h } = boardPx();
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('width',w); svg.setAttribute('height',h);

function renderLandscape() {
  document.getElementById('bg-landscape').innerHTML = '';

// ═══════════════════════════════════════════════════════════════
// DRAG, RESIZE & ROTATE
// ═══════════════════════════════════════════════════════════════

let dragState = null;

// Helper: build the rotation-only CSS transform for a component (no perspective)
function compRotationTransform(c) {
  const rot = c.rotation || 0, skX = c.skewX || 0, skY = c.skewY || 0;
  if (!rot && !skX && !skY) return '';
  let t = '';
  if (rot) t += `rotate(${rot}deg)`;
  if (skX) t += ` skewX(${skX}deg)`;
  if (skY) t += ` skewY(${skY}deg)`;
  return t.trim();
}

function attachDrag(el, comp) {
  el.addEventListener('mousedown', e => {
    if (e.button === 2) return;

    // Locked: select only, no drag
    if (comp.locked) {
      e.preventDefault(); e.stopPropagation();
      if (!e.shiftKey) state.selectedIds = [comp.id];
      else if (!state.selectedIds.includes(comp.id)) state.selectedIds.push(comp.id);
      expandSelectionToGroups(); renderAll();
      return;
    }

    // Rotate handle
    if (e.target.classList.contains('rotate-handle')) {
      e.preventDefault(); e.stopPropagation(); saveUndo();
      const rect = document.getElementById('board').getBoundingClientRect();
      const px = pctToPx(comp);
      const cx = rect.left + px.x + px.w / 2;
      const cy = rect.top + px.y + px.h / 2;
      dragState = {
        type: 'rotate', comp, cx, cy,
        startAngle: Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI,
        startRot: comp.rotation || 0,
      };
      return;
    }

    // Resize handle
    if (e.target.classList.contains('rh')) {
      e.preventDefault(); e.stopPropagation(); saveUndo();
      dragState = {
        type: 'resize',
        handle: e.target.dataset.handle,
        comp,
        startMouse: { x: e.clientX, y: e.clientY },
        startComp: { x: comp.x, y: comp.y, w: comp.w, h: comp.h },
        bpx: boardPx(),
      };
      return;
    }

    // Move: select component, set up drag
    e.preventDefault(); e.stopPropagation();

    // Update selection
    if (!e.shiftKey) {
      if (!state.selectedIds.includes(comp.id)) {
        state.selectedIds = [comp.id];
        expandSelectionToGroups();
        renderAll();
      }
    } else {
      if (!state.selectedIds.includes(comp.id)) {
        state.selectedIds.push(comp.id);
        expandSelectionToGroups();
        renderAll();
      }
    }

    saveUndo();

    // Capture start positions for all selected components
    const bpx = boardPx();
    dragState = {
      type: 'move',
      startMouse: { x: e.clientX, y: e.clientY },
      startPositions: state.selectedIds.map(id => {
        const c = state.components.find(c => c.id === id);
        return { id, x: c.x, y: c.y };
      }),
      bpx,
    };

    // Immediately set rotation-only transforms on all selected perspective comps
    // so the first mousemove doesn't cause a visual jump
    state.selectedIds.forEach(id => {
      const c = state.components.find(c => c.id === id);
      const domEl = document.querySelector(`.comp[data-id="${id}"]`);
      if (domEl && c && isCompPerspective(c)) {
        domEl.style.transform = compRotationTransform(c) || 'none';
        domEl.style.transformOrigin = 'center center';
      }
    });
  });
}

// ── MOUSEMOVE: handle all drag types ──
document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const bpx = dragState.bpx || boardPx();

  // ── ROTATE ──
  if (dragState.type === 'rotate') {
    const angle = Math.atan2(e.clientY - dragState.cy, e.clientX - dragState.cx) * 180 / Math.PI;
    let newRot = (dragState.startRot + (angle - dragState.startAngle)) % 360;
    if (e.shiftKey) newRot = Math.round(newRot / 15) * 15;
    dragState.comp.rotation = newRot;
    const el = document.querySelector(`.comp[data-id="${dragState.comp.id}"]`);
    if (el) {
      el.style.transform = compRotationTransform(dragState.comp) || 'none';
      el.style.transformOrigin = 'center center';
    }
    if (!dragState._propsRAF) {
      dragState._propsRAF = requestAnimationFrame(() => { renderPropsPanel(); dragState._propsRAF = null; });
    }
    return;
  }

  const dx = (e.clientX - dragState.startMouse.x) / bpx.w * 100;
  const dy = (e.clientY - dragState.startMouse.y) / bpx.h * 100;

  // ── MOVE ──
  if (dragState.type === 'move') {
    // Update model positions from start + delta
    dragState.startPositions.forEach(sp => {
      const c = state.components.find(c => c.id === sp.id);
      if (c) {
        c.x = Math.max(0, Math.min(100 - c.w, sp.x + dx));
        c.y = Math.max(0, Math.min(100 - c.h, sp.y + dy));
      }
    });

    // Snap (unlocked components + board edges only)
    if (state.snapEnabled && !e.altKey) {
      if (!dragState._snapTargets) dragState._snapTargets = getSnapTargets(state.selectedIds);
      const primary = state.components.find(c => c.id === state.selectedIds[0]);
      if (primary) {
        const { snapX, snapY } = applySnap(primary, dragState._snapTargets);
        if (snapX) state.selectedIds.forEach(id => { const c = state.components.find(c => c.id === id); if (c) c.x += snapX.delta; });
        if (snapY) state.selectedIds.forEach(id => { const c = state.components.find(c => c.id === id); if (c) c.y += snapY.delta; });
        renderSnapGuides(snapX, snapY);
      }
    } else { clearSnapGuides(); }

    // Update DOM: position only, rotation preserved, no perspective during drag
    state.selectedIds.forEach(id => {
      const c = state.components.find(c => c.id === id);
      const el = document.querySelector(`.comp[data-id="${id}"]`);
      if (el && c) {
        el.style.left = (c.x / 100 * bpx.w) + 'px';
        el.style.top = (c.y / 100 * bpx.h) + 'px';
      }
    });

    if (state.showNegSpace) updateNegSpaceCanvas();
    if (!dragState._propsRAF) {
      dragState._propsRAF = requestAnimationFrame(() => { renderPropsPanel(); dragState._propsRAF = null; });
    }
  }

  // ── RESIZE ──
  if (dragState.type === 'resize') {
    const sc = dragState.startComp, h = dragState.handle, c = dragState.comp;
    let nx = sc.x, ny = sc.y, nw = sc.w, nh = sc.h;
    const MIN = 0.5;

    // Rotate mouse delta into component's local space so handles
    // stretch in the visually correct direction after rotation
    const rot = (c.rotation || 0) * Math.PI / 180;
    const ldx = dx * Math.cos(rot) + dy * Math.sin(rot);   // local-X delta
    const ldy = -dx * Math.sin(rot) + dy * Math.cos(rot);  // local-Y delta

    if (h.includes('r')) nw = Math.max(MIN, sc.w + ldx);
    if (h.includes('l')) { const d = Math.min(ldx, sc.w - MIN); nx = sc.x + d; nw = sc.w - d; }
    if (h === 'bm' || h === 'bl' || h === 'br') nh = Math.max(MIN, sc.h + ldy);
    if (h === 'tm' || h === 'tl' || h === 'tr') { const d = Math.min(ldy, sc.h - MIN); ny = sc.y + d; nh = sc.h - d; }

    // Shift = lock aspect ratio
    if (e.shiftKey && sc.w > 0 && sc.h > 0) {
      const aspect = sc.w / sc.h;
      if (h === 'ml' || h === 'mr') nh = nw / aspect;
      else if (h === 'tm' || h === 'bm') nw = nh * aspect;
      else {
        if (Math.abs(nw - sc.w) >= Math.abs(nh - sc.h)) nh = nw / aspect;
        else nw = nh * aspect;
        if (h.includes('l')) nx = sc.x + sc.w - nw;
        if (h.includes('t')) ny = sc.y + sc.h - nh;
      }
    }

    c.x = Math.max(0, nx); c.y = Math.max(0, ny);
    c.w = Math.min(100 - c.x, nw); c.h = Math.min(100 - c.y, nh);

    // Snap resize edges
    if (state.snapEnabled && !e.altKey) {
      if (!dragState._snapTargets) dragState._snapTargets = getSnapTargets([c.id]);
      const th = state.snapThreshold;
      if (h.includes('r')) { const s = snapValue(c.x + c.w, dragState._snapTargets.x, th); if (s !== null) c.w = s - c.x; }
      if (h.includes('l')) { const s = snapValue(c.x, dragState._snapTargets.x, th); if (s !== null) { c.w += c.x - s; c.x = s; } }
      if (h === 'bm' || h === 'bl' || h === 'br') { const s = snapValue(c.y + c.h, dragState._snapTargets.y, th); if (s !== null) c.h = s - c.y; }
      if (h === 'tm' || h === 'tl' || h === 'tr') { const s = snapValue(c.y, dragState._snapTargets.y, th); if (s !== null) { c.h += c.y - s; c.y = s; } }
      const snapX = h.includes('r') ? (snapValue(c.x + c.w, dragState._snapTargets.x, th) !== null ? { to: c.x + c.w } : null) :
                    h.includes('l') ? (snapValue(c.x, dragState._snapTargets.x, th) !== null ? { to: c.x } : null) : null;
      const snapY = (h === 'bm' || h === 'bl' || h === 'br') ? (snapValue(c.y + c.h, dragState._snapTargets.y, th) !== null ? { to: c.y + c.h } : null) :
                    (h === 'tm' || h === 'tl' || h === 'tr') ? (snapValue(c.y, dragState._snapTargets.y, th) !== null ? { to: c.y } : null) : null;
      renderSnapGuides(snapX, snapY);
    } else { clearSnapGuides(); }

    // Update DOM
    const el = document.querySelector(`.comp[data-id="${c.id}"]`);
    if (el) {
      el.style.left = (c.x / 100 * bpx.w) + 'px';
      el.style.top = (c.y / 100 * bpx.h) + 'px';
      el.style.width = (c.w / 100 * bpx.w) + 'px';
      el.style.height = (c.h / 100 * bpx.h) + 'px';
    }

    if (state.showNegSpace) updateNegSpaceCanvas();
    if (!dragState._propsRAF) {
      dragState._propsRAF = requestAnimationFrame(() => { renderPropsPanel(); dragState._propsRAF = null; });
    }
  }
});

// ── MOUSEUP: end drag, rebuild everything cleanly ──
document.addEventListener('mouseup', () => {
  if (dragState) {
    dragState = null;
    clearSnapGuides();
    renderAll(); // Full rebuild: perspective, rotation, everything reapplied correctly
  }
});

// ── BOARD CLICK: deselect when clicking empty space ──
document.getElementById('board').addEventListener('mousedown', e => {
  if (e.button === 2) return;
  if (e.target === e.currentTarget || e.target.id === 'bg-landscape' ||
      e.target.closest('#bg-landscape') || e.target.closest('#grid-overlay')) {
    state.selectedIds = [];
    renderAll();
  }
});

// ═══════════════════════════════════════════════════════════════
// SNAP TO EDGES
// ═══════════════════════════════════════════════════════════════

function getSnapTargets(excludeIds) {
  // Collect edges and centers from UNLOCKED, non-dragged components only.
  // Locked UI chrome is excluded — too many snap points make dragging sticky.
  const targets = { x: [], y: [] };
  const exclude = new Set(excludeIds);
  state.components.forEach(c => {
    if (exclude.has(c.id) || !c.visible || c.locked) return;
    const layer = state.layers.find(l => l.id === c.layer);
    if (layer && !layer.visible) return;
    targets.x.push(c.x, c.x + c.w, c.x + c.w / 2);
    targets.y.push(c.y, c.y + c.h, c.y + c.h / 2);
  });
  // Board edges and center
  targets.x.push(0, 50, 100);
  targets.y.push(0, 50, 100);
  return targets;
}

function snapValue(val, targets, threshold) {
  let best = null, bestDist = threshold;
  for (const t of targets) {
    const d = Math.abs(val - t);
    if (d < bestDist) { bestDist = d; best = t; }
  }
  return best;
}

function applySnap(comp, targets) {
  if (!state.snapEnabled) return { snapX: null, snapY: null };
  const th = state.snapThreshold;
  const edges = {
    x: [comp.x, comp.x + comp.w, comp.x + comp.w / 2],
    y: [comp.y, comp.y + comp.h, comp.y + comp.h / 2],
  };
  let snapX = null, snapY = null;
  // Find best snap for any edge
  let bestDx = th, bestDy = th;
  for (const ex of edges.x) {
    const s = snapValue(ex, targets.x, th);
    if (s !== null && Math.abs(ex - s) < bestDx) {
      bestDx = Math.abs(ex - s);
      snapX = { from: ex, to: s, delta: s - ex };
    }
  }
  for (const ey of edges.y) {
    const s = snapValue(ey, targets.y, th);
    if (s !== null && Math.abs(ey - s) < bestDy) {
      bestDy = Math.abs(ey - s);
      snapY = { from: ey, to: s, delta: s - ey };
    }
  }
  return { snapX, snapY };
}

function renderSnapGuides(snapX, snapY) {
  let svg = document.getElementById('snap-guides');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'snap-guides';
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;';
    document.getElementById('board').appendChild(svg);
  }
  svg.innerHTML = '';
  const bpx = boardPx();
  if (snapX) {
    const x = snapX.to / 100 * bpx.w;
    svg.innerHTML += `<line x1="${x}" y1="0" x2="${x}" y2="${bpx.h}" stroke="rgba(80,200,255,0.5)" stroke-width="1" stroke-dasharray="4,4"/>`;
  }
  if (snapY) {
    const y = snapY.to / 100 * bpx.h;
    svg.innerHTML += `<line x1="0" y1="${y}" x2="${bpx.w}" y2="${y}" stroke="rgba(80,200,255,0.5)" stroke-width="1" stroke-dasharray="4,4"/>`;
  }
}

  const svg = document.getElementById('snap-guides');
  if (svg) svg.innerHTML = '';
}

let hoverTooltipTimeout = null;

function showHoverTooltip(comp, e) {
  if (dragState) return;
  clearTimeout(hoverTooltipTimeout);
  hoverTooltipTimeout = setTimeout(() => {
    const tt = document.getElementById('hover-tooltip');
    const nameEl = document.getElementById('ht-name');
    const propsEl = document.getElementById('ht-props');
    const layerObj = state.layers.find(l => l.id === comp.layer);
    nameEl.textContent = comp.label;
    const bpx = boardPx();
    const pxW = (comp.w / 100 * bpx.w).toFixed(0);
    const pxH = (comp.h / 100 * bpx.h).toFixed(0);
    const ar = (comp.w / 100 * bpx.w) / (comp.h / 100 * bpx.h);
    let arTag = '';
    if (Math.abs(ar - 1) < 0.02) arTag = ' (square)';
    else if (Math.abs(ar - 1.618) < 0.05 || Math.abs(ar - 0.618) < 0.03) arTag = ' (golden)';
    else if (Math.abs(ar - 16/9) < 0.05 || Math.abs(ar - 9/16) < 0.03) arTag = ' (16:9)';
    else if (Math.abs(ar - 4/3) < 0.05 || Math.abs(ar - 3/4) < 0.03) arTag = ' (4:3)';
    propsEl.innerHTML = `
      <div class="ht-row">Layer: <span class="ht-val">${layerObj ? layerObj.name : comp.layer}</span></div>
      <div class="ht-row">Position: <span class="ht-val">${comp.x.toFixed(1)}%, ${comp.y.toFixed(1)}%</span></div>
      <div class="ht-row">Size: <span class="ht-val">${comp.w.toFixed(1)}% × ${comp.h.toFixed(1)}%</span></div>
      <div class="ht-row">Pixels: <span class="ht-val">${pxW} × ${pxH}px</span></div>
      <div class="ht-row">Ratio: <span class="ht-val">${ar.toFixed(2)}:1${arTag}</span></div>
      <div class="ht-row">Rotation: <span class="ht-val">${(comp.rotation||0).toFixed(1)}°</span></div>
      <div class="ht-row">Opacity: <span class="ht-val">${((comp.opacity!==undefined?comp.opacity:1)*100).toFixed(0)}%</span></div>
      ${comp.shape && comp.shape !== 'rect' ? `<div class="ht-row">Shape: <span class="ht-val">${comp.shape}</span></div>` : ''}
      ${comp.visualType && comp.visualType !== 'zone' ? `<div class="ht-row">Type: <span class="ht-val">${comp.visualType}</span></div>` : ''}`;
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY + 14) + 'px';
    tt.classList.add('visible');
  }, 350);
}

function moveHoverTooltip(e) {
  const tt = document.getElementById('hover-tooltip');
  if (tt.classList.contains('visible')) {
    tt.style.left = Math.min(e.clientX + 14, window.innerWidth - 290) + 'px';
    tt.style.top = Math.min(e.clientY + 14, window.innerHeight - 160) + 'px';
  }
}

function hideHoverTooltip() {
  clearTimeout(hoverTooltipTimeout);
  document.getElementById('hover-tooltip').classList.remove('visible');
}

const ctxMenu = document.getElementById('ctx-menu');

function showContextMenu(x, y, items) {
  hideContextMenu();
  let html = '';
  for (const item of items) {
    if (item.sep) { html += '<div class="ctx-sep"></div>'; continue; }
    if (item.slider) {
      html += `<div class="ctx-slider-row">
        <label>${item.label}</label>
        <input type="range" min="${item.min||0}" max="${item.max||100}" step="${item.step||1}" value="${item.value||0}"
          oninput="${item.oninput}">
        <span id="${item.spanId||''}">${item.valueLabel||''}</span>
      </div>`;
      continue;
    }
    if (item.submenu) {
      html += `<div class="ctx-submenu"><div class="ctx-item">${item.label}<span class="ctx-arrow">▸</span></div>
        <div class="ctx-sub-items">`;
      for (const sub of item.submenu) {
        if (sub.sep) { html += '<div class="ctx-sep"></div>'; continue; }
        html += `<div class="ctx-item${sub.danger?' danger':''}" onclick="${sub.action}">${sub.label}${sub.active?'  ✓':''}</div>`;
      }
      html += '</div></div>';
      continue;
    }
    html += `<div class="ctx-item${item.danger?' danger':''}" onclick="${item.action}">${item.label}${item.key?`<span class="ctx-key">${item.key}</span>`:''}${item.active?'  ✓':''}</div>`;
  }
  ctxMenu.innerHTML = html;
  ctxMenu.style.left = '-9999px';
  ctxMenu.style.top = '-9999px';
  ctxMenu.style.display = 'block';
  ctxMenu.classList.add('show');
  ctxMenu.offsetHeight; // force reflow
  const menuRect = ctxMenu.getBoundingClientRect();
  const menuW = menuRect.width, menuH = menuRect.height;
  ctxMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - menuW - 8)) + 'px';
  ctxMenu.style.top  = Math.max(8, Math.min(y, window.innerHeight - menuH - 8)) + 'px';
  // Position submenus within viewport — JS only, no CSS :hover
  ctxMenu.querySelectorAll('.ctx-submenu').forEach(sub => {
    sub.addEventListener('mouseenter', () => {
      // Close all sibling submenus first
      ctxMenu.querySelectorAll('.ctx-sub-items').forEach(s => s.style.display = 'none');
      const subItems = sub.querySelector('.ctx-sub-items');
      if (!subItems) return;
      const parentRect = sub.getBoundingClientRect();
      subItems.style.display = 'block';
      subItems.offsetHeight;
      const subRect = subItems.getBoundingClientRect();
      let left = parentRect.right;
      let top = parentRect.top - 4;
      if (left + subRect.width > window.innerWidth - 8) left = parentRect.left - subRect.width;
      if (top + subRect.height > window.innerHeight - 8) top = window.innerHeight - subRect.height - 8;
      if (top < 8) top = 8;
      subItems.style.left = left + 'px';
      subItems.style.top = top + 'px';
    });
    sub.addEventListener('mouseleave', () => {
      const subItems = sub.querySelector('.ctx-sub-items');
      if (subItems) subItems.style.display = 'none';
    });
  });
}

function hideContextMenu() { ctxMenu.classList.remove('show'); ctxMenu.style.display = 'none'; if (ctxMenuLeaveTimer) { clearTimeout(ctxMenuLeaveTimer); ctxMenuLeaveTimer = null; } }
let ctxMenuLeaveTimer = null;
ctxMenu.addEventListener('mouseenter', () => { if (ctxMenuLeaveTimer) { clearTimeout(ctxMenuLeaveTimer); ctxMenuLeaveTimer = null; } });
ctxMenu.addEventListener('mouseleave', () => { ctxMenuLeaveTimer = setTimeout(hideContextMenu, 400); });
document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideContextMenu(); });
document.addEventListener('mousedown', e => { if (!ctxMenu.contains(e.target)) hideContextMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideContextMenu(); });

function changeCompShape(id, shape) {
  saveUndo();
  const comp = state.components.find(c => c.id === id);
  if (!comp) return;
  comp.shape = shape;
  renderAll();
  setStatus(`${comp.label}: shape → ${shape}`);
}

function changeCompVisualType(id, vtype) {
  saveUndo();
  const comp = state.components.find(c => c.id === id);
  if (!comp) return;
  comp.visualType = vtype;
  renderAll();
  setStatus(`${comp.label}: visual type → ${vtype}`);
}

function resetToOriginal(id) {
  saveUndo();
  const comp = state.components.find(c => c.id === id);
  if (!comp) return;
  const template = COMP_TEMPLATES.find(t => t.type === comp.type);
  if (!template) { setStatus('No template found for this component.'); return; }
  // Preserve id and restore template values
  const keepId = comp.id;
  comp.x = template.x;
  comp.y = template.y;
  comp.w = template.w;
  comp.h = template.h;
  comp.bg = template.bg;
  comp.border = template.border;
  comp.color = template.color;
  comp.borderRadius = template.borderRadius || '4px';
  comp.dashed = template.dashed || false;
  comp.rotation = 0;
  comp.skewX = 0;
  comp.skewY = 0;
  comp.opacity = 1;
  comp.shape = undefined;
  comp.visualType = undefined;
  renderAll();
  setStatus(`${comp.label}: reset to original`);
}
