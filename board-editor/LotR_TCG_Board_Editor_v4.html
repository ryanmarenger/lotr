  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setStatus('Saved as: ' + filename);
}

function exportCompositionGuide() {
  const W = 1920, H = 1080; // 16:9 at 1080p
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background — dark neutral
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, W, H);

  // Horizon line
  const horizPx = state.horizonY / 100 * H;
  if (state.horizonY >= -10 && state.horizonY <= 110) {
    ctx.strokeStyle = 'rgba(255,200,50,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([12, 6]);
    ctx.beginPath(); ctx.moveTo(0, horizPx); ctx.lineTo(W, horizPx); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,200,50,0.7)';
    ctx.font = '14px Georgia';
    ctx.fillText('HORIZON ' + state.horizonY.toFixed(0) + '%', W - 180, horizPx - 8);
  }

  // Draw each component as a composition zone
  const dynamicComps = state.components.filter(c => c.visible && c.coverType === 'dynamic');
  const opaqueComps = state.components.filter(c => c.visible && c.coverType === 'opaque');
  const transComps = state.components.filter(c => c.visible && c.coverType === 'translucent');

  // First pass: mark "flat ground needed" areas (dynamic zones — where cards land)
  dynamicComps.forEach(c => {
    const x = c.x / 100 * W, y = c.y / 100 * H;
    const w = c.w / 100 * W, h = c.h / 100 * H;
    // Green fill = flat ground needed
    ctx.fillStyle = 'rgba(80,200,80,0.15)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(80,200,80,0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    // Label
    ctx.fillStyle = 'rgba(80,200,80,0.8)';
    ctx.font = 'bold 13px Georgia';
    ctx.fillText(c.label + ' — FLAT GROUND', x + 8, y + 18);
    ctx.font = '11px Georgia';
    ctx.fillStyle = 'rgba(80,200,80,0.5)';
    ctx.fillText('Cards land here. Needs level terrain.', x + 8, y + 34);
  });

  // Opaque zones — "UI covers this area"
  opaqueComps.forEach(c => {
    const x = c.x / 100 * W, y = c.y / 100 * H;
    const w = c.w / 100 * W, h = c.h / 100 * H;
    ctx.fillStyle = 'rgba(100,100,255,0.12)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(100,100,255,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = 'rgba(100,100,255,0.5)';
    ctx.font = '10px Georgia';
    ctx.fillText(c.label + ' (UI)', x + 4, y + 14);
  });

  // Translucent zones — landscape shows through
  transComps.forEach(c => {
    const x = c.x / 100 * W, y = c.y / 100 * H;
    const w = c.w / 100 * W, h = c.h / 100 * H;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '10px Georgia';
    ctx.fillText(c.label + ' (see-through)', x + 4, y + 14);
  });

  // Paint ALL areas not covered by dynamic/opaque zones as "open landscape" in gold
  // Create a mask: start with full canvas, subtract zone rectangles
  const coveredRects = state.components.filter(c => c.visible && (c.coverType === 'dynamic' || c.coverType === 'opaque'))
    .map(c => ({ x: c.x / 100 * W, y: c.y / 100 * H, w: c.w / 100 * W, h: c.h / 100 * H }));

  // Draw a faint gold wash over the entire board first
  ctx.fillStyle = 'rgba(255,160,40,0.06)';
  ctx.fillRect(0, 0, W, H);
  // Then cut out the zones (draw dark over them to erase the gold wash)
  ctx.fillStyle = '#1a1a1a';
  coveredRects.forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));

  // Add "open landscape" labels in the largest gaps
  ctx.fillStyle = 'rgba(255,160,40,0.8)';
  ctx.font = 'bold 18px Georgia';
  // Try center of board
  const centerX = W * 0.5, centerY = H * 0.42;
  let centerClear = true;
  for (const r of coveredRects) {
    if (centerX > r.x && centerX < r.x + r.w && centerY > r.y && centerY < r.y + r.h) { centerClear = false; break; }
  }
  if (centerClear) {
    // Dark backing for readability
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(centerX - 200, centerY - 20, 400, 50);
    ctx.fillStyle = 'rgba(255,160,40,0.9)';
    ctx.font = 'bold 18px Georgia';
    ctx.fillText('OPEN LANDSCAPE — DRAMATIC TERRAIN OK', centerX - 190, centerY + 2);
    ctx.font = '12px Georgia';
    ctx.fillStyle = 'rgba(255,160,40,0.6)';
    ctx.fillText('Cliffs, water, ruins, trees — anything visually interesting', centerX - 172, centerY + 22);
  }

  // Camera info box — bottom left
  const zoom = state.boardZoom || 1.0;
  const tilt = state.boardTiltX || 0;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(20, H - 120, 400, 100);
  ctx.strokeStyle = 'rgba(255,200,50,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, H - 120, 400, 100);
  ctx.fillStyle = 'rgba(255,200,50,0.85)';
  ctx.font = 'bold 13px Georgia';
  ctx.fillText('CAMERA SPEC', 34, H - 98);
  ctx.font = '12px Georgia';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const layoutName = state.loadedLayoutName || 'custom';
  ctx.fillText('Layout: ' + layoutName, 34, H - 78);
  ctx.fillText('Horizon: ' + state.horizonY.toFixed(0) + '%   Tilt: ' + tilt + '\u00B0   Zoom: ' + zoom.toFixed(2) + '\u00D7', 34, H - 58);
  const feel = tilt < 10 ? 'Low angle — vast, open, cinematic' :
               tilt < 20 ? 'Medium angle — balanced, natural' :
               tilt < 30 ? 'High angle — enclosed, pressing' : 'Overhead — claustrophobic, map-like';
  ctx.fillText('Feel: ' + feel, 34, H - 38);

  // Legend — top right
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(W - 280, 10, 260, 90);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.strokeRect(W - 280, 10, 260, 90);
  ctx.font = 'bold 11px Georgia';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('COMPOSITION GUIDE', W - 268, 30);
  ctx.font = '11px Georgia';
  ctx.fillStyle = 'rgba(80,200,80,0.8)';
  ctx.fillText('\u25A0 Flat ground (cards land here)', W - 268, 50);
  ctx.fillStyle = 'rgba(100,100,255,0.6)';
  ctx.fillText('\u25A0 UI overlay (landscape hidden)', W - 268, 66);
  ctx.fillStyle = 'rgba(255,160,40,0.6)';
  ctx.fillText('\u25A0 Open landscape (dramatic terrain OK)', W - 268, 82);

  // Export
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (layoutName || 'composition') + '-guide.png';
    a.click();
    setStatus('Composition guide exported.');
  });
}

function importJSON() {
  const input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange = e => {
    const reader=new FileReader();
    reader.onload = ev => {
      try {
        const data=JSON.parse(ev.target.result);
        if (data.components) state.components=data.components;
        if (data.layers) state.layers=data.layers;
        if (data.boardRatio) state.boardRatio=data.boardRatio;
        if (data.nextId) state.nextId=data.nextId;
        if (data.horizonY!==undefined) state.horizonY=data.horizonY;
        if (data.elementConfig) state.elementConfig=data.elementConfig;
        if (data.boardTiltX!==undefined) state.boardTiltX=data.boardTiltX;
        if (data.boardTiltY!==undefined) state.boardTiltY=data.boardTiltY;
        if (data.perspectiveDepth!==undefined) state.perspectiveDepth=data.perspectiveDepth;
        if (data.vanishX!==undefined) state.vanishX=data.vanishX;
        if (data.vanishY!==undefined) state.vanishY=data.vanishY;
        if (data.boardZoom!==undefined) state.boardZoom=data.boardZoom;
        // Store as baseline for "Reset to Default Layout"
        state.loadedLayoutName = data.name || e.target.files[0].name.replace('.json','');
        state.loadedLayoutData = JSON.parse(JSON.stringify(data));
        applyBoardTilt(); renderVanishPoint();
        buildChecklist(); renderAll(); setStatus('Layout loaded: ' + state.loadedLayoutName);
      } catch(err) { setStatus('Error loading JSON.'); }
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
  setTimeout(()=>{ document.getElementById('status-msg').textContent='Right-click for options · Hover left edge for checklist'; }, 4000);
}

document.addEventListener('keydown', e => {
  const inInput = ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key==='z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.metaKey||e.ctrlKey) && (e.key==='y'||(e.key==='z'&&e.shiftKey))) { e.preventDefault(); redo(); return; }
  if ((e.metaKey||e.ctrlKey) && e.key==='d') { e.preventDefault(); if(state.selectedIds.length===1)duplicateComp(state.selectedIds[0]); return; }
  if ((e.metaKey||e.ctrlKey) && e.key==='a') { e.preventDefault(); selectAll(true); return; }
  if (inInput) return;
  if (e.key==='Delete'||e.key==='Backspace') deleteSelected();
  if (e.key==='Escape') { selectAll(false); hideContextMenu(); hideMasterModal(); }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
    e.preventDefault();
    const d = e.shiftKey ? 0.5 : 0.1;
    state.selectedIds.forEach(id => {
      const c=state.components.find(c=>c.id===id); if(!c)return;
      if (e.key==='ArrowLeft') c.x=Math.max(0,c.x-d);
      if (e.key==='ArrowRight') c.x=Math.min(100-c.w,c.x+d);
      if (e.key==='ArrowUp') c.y=Math.max(0,c.y-d);
      if (e.key==='ArrowDown') c.y=Math.min(100-c.h,c.y+d);
    });
    renderAll();
  }
});

// ═══════════════════════════════════════════════════════════════
// DEFAULT LAYOUT
// ═══════════════════════════════════════════════════════════════

function loadDefault() {
  // If a layout was loaded from JSON, reset to that layout's saved state
  if (state.loadedLayoutData) {
    const data = state.loadedLayoutData;
    state.components = JSON.parse(JSON.stringify(data.components || []));
    state.selectedIds = [];
    if (data.nextId) state.nextId = data.nextId;
    if (data.horizonY !== undefined) state.horizonY = data.horizonY;
    if (data.boardTiltX !== undefined) state.boardTiltX = data.boardTiltX;
    if (data.boardTiltY !== undefined) state.boardTiltY = data.boardTiltY;
    if (data.perspectiveDepth !== undefined) state.perspectiveDepth = data.perspectiveDepth;
    if (data.vanishX !== undefined) state.vanishX = data.vanishX;
    if (data.vanishY !== undefined) state.vanishY = data.vanishY;
    applyBoardTilt(); renderVanishPoint();
    renderAll(); buildChecklist();
    setStatus('Reset to: ' + (state.loadedLayoutName || 'loaded layout'));
    return;
  }
  // Otherwise use hardcoded default
  state.components=[]; state.selectedIds=[]; state.nextId=1;
  const defaults = ['baradur','phase-tracker','shadow-zone','opp-hand','opp-piles','ring-spinner',
    'twilight-pool','adventure-path','fellowship-zone','your-piles','hand-fan','pass-btn','action-log','left-dock','right-dock'];
  const overrides = {
    'hand-fan':{x:52,y:55,w:48,h:45},'pass-btn':{x:45,y:94,w:10,h:5},'shadow-zone':{x:1,y:8,w:98,h:11},
    'fellowship-zone':{x:1,y:38,w:98,h:18},
    'twilight-pool':{x:43,y:21,w:14,h:15},'adventure-path':{x:10,y:53,w:68,h:7},'baradur':{x:93,y:1,w:4,h:10},
  };
  defaults.forEach(type => { const t=COMP_TEMPLATES.find(t=>t.type===type); if(t)addComponent({...t,...(overrides[type]||{})}); });
  state.selectedIds=[];
  renderAll();
  buildChecklist();
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildChecklist();
initHorizonDrag();
resizeBoard();
// Editor opens empty — user loads a layout or starts fresh
window.addEventListener('resize', () => resizeBoard());
</script>
