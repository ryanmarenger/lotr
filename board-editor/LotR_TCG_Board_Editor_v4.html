function updateWarningBadge() {
  const badge = document.getElementById('warning-badge');
  let count = 0;
  GAME_ELEMENTS.forEach(elem => {
    const displayType = state.elementConfig[elem.id]?.displayType || elem.displayType;
    if (displayType === 'Board Zone' && elem.templateType) {
      if (!state.components.some(c => c.type === elem.templateType)) count++;
    }
    if (elem.openQ) count++;
  });
  badge.textContent = count;
  badge.className = 'warning-badge' + (count === 0 ? ' zero' : '');
  badge.title = count === 0 ? 'All items accounted for' : `${count} items missing or need attention`;
}

// ═══════════════════════════════════════════════════════════════
// MASTER LIST MODAL
// ═══════════════════════════════════════════════════════════════

function showMasterModal() {
  buildMasterList();
  document.getElementById('master-modal').classList.add('visible');
}

function hideMasterModal() {
  document.getElementById('master-modal').classList.remove('visible');
}

function buildMasterList() {
  const body = document.getElementById('master-body');
  body.innerHTML = '';
  const categories = [...new Set(GAME_ELEMENTS.map(e => e.cat))];
  for (const cat of categories) {
    const elems = GAME_ELEMENTS.filter(e => e.cat === cat);
    const mlAllGrayed = state.landscapeMode && elems.every(e => !isElementLandscapeRelevant(e));
    const catDiv = document.createElement('div');
    catDiv.className = 'ml-category' + (mlAllGrayed ? ' landscape-grayed' : '');
    catDiv.textContent = cat.toUpperCase();
    body.appendChild(catDiv);

    for (const elem of elems) {
      const displayType = state.elementConfig[elem.id]?.displayType || elem.displayType;
      const isPlaced = isElementPlaced(elem);
      const isBoardZone = displayType === 'Board Zone';
      const hasTemplate = !!elem.templateType;
      const mlGrayed = state.landscapeMode && !isElementLandscapeRelevant(elem);

      const row = document.createElement('div');
      row.className = 'ml-item' + (elem.openQ ? ' has-warning' : '') + (mlGrayed ? ' landscape-grayed' : '');

      // Determine check state
      let checkClass = 'ml-check';
      let checkContent = '';
      if (isPlaced) {
        checkClass += ' placed';
        checkContent = '✓';
      } else if (!isBoardZone) {
        checkClass += ' nonboard';
        checkContent = '~';
      } else {
        checkClass += ' missing';
        checkContent = '';
      }

      row.innerHTML = `
        <div class="${checkClass}">${checkContent}</div>
        <div class="ml-name">${elem.name}${elem.openQ ? ' ⚠' : ''}</div>
        <div class="ml-desc">${elem.desc}</div>
        <div class="ml-type">${displayType}</div>`;

      row.addEventListener('click', () => {
        if (isPlaced) {
          hideMasterModal();
          const comp = state.components.find(c => c.type === elem.templateType);
          if (comp) { state.selectedIds = [comp.id]; renderAll(); }
        } else if (hasTemplate && isBoardZone) {
          const template = COMP_TEMPLATES.find(t => t.type === elem.templateType);
          if (template) { addComponent(template); buildMasterList(); setStatus(`Added: ${elem.name}`); }
        }
      });
      row.style.cursor = (isPlaced || (hasTemplate && isBoardZone)) ? 'pointer' : 'default';

      body.appendChild(row);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// CHECKLIST FLY-OUT
// ═══════════════════════════════════════════════════════════════

const checklistTrigger = document.getElementById('checklist-trigger');
const checklistPanel = document.getElementById('checklist-panel');
let checklistPinned = false;

checklistTrigger.addEventListener('mouseenter', () => { checklistPanel.classList.add('open'); });
checklistTrigger.addEventListener('mouseleave', e => {
  if (!checklistPinned && !checklistPanel.matches(':hover')) checklistPanel.classList.remove('open');
});
checklistPanel.addEventListener('mouseleave', () => {
  if (!checklistPinned) checklistPanel.classList.remove('open');
});
checklistPanel.addEventListener('mouseenter', () => { checklistPanel.classList.add('open'); });

function buildChecklist() {
  const body = document.getElementById('checklist-body');
  body.innerHTML = '';
  const categories = [...new Set(GAME_ELEMENTS.map(e => e.cat))];
  for (const cat of categories) {
    const elems = GAME_ELEMENTS.filter(e => e.cat === cat);
    const allGrayed = state.landscapeMode && elems.every(e => !isElementLandscapeRelevant(e));
    const catDiv = document.createElement('div');
    catDiv.className = 'cl-category' + (allGrayed ? ' landscape-grayed' : '');
    catDiv.textContent = cat.toUpperCase();
    body.appendChild(catDiv);

    for (const elem of elems) {
      const isPlaced = isElementPlaced(elem);
      const displayType = state.elementConfig[elem.id]?.displayType || elem.displayType;
      const isBoardZone = displayType === 'Board Zone';
      const isNonBoard = !isBoardZone;
      const lGrayed = state.landscapeMode && !isElementLandscapeRelevant(elem);

      const row = document.createElement('div');
      row.className = 'cl-item' + (isPlaced ? ' placed' : '') + (isNonBoard && !isPlaced ? ' nonboard' : '') + (lGrayed ? ' landscape-grayed' : '');
      row.title = elem.desc + (elem.openQ ? `\n⚠ Open UX Question #${elem.openQ}` : '');

      // Checkbox indicator
      let checkHTML = '<div class="cl-checkbox">';
      if (isPlaced) checkHTML += '✓';
      else if (isNonBoard) checkHTML += '~';
      checkHTML += '</div>';

      // Location label for non-board items
      let locationHTML = '';
      if (isNonBoard && !isPlaced) {
        locationHTML = `<div class="cl-location">in ${displayType}</div>`;
      }

      row.innerHTML = `
        ${checkHTML}
        <div class="cl-status"></div>
        <div class="cl-name">${elem.name}${elem.openQ ? ' ⚠' : ''}</div>
        ${locationHTML}
        <div class="cl-type-badge">${displayType}</div>`;

      row.addEventListener('click', e => {
        if (e.button !== 0) return;
        if (elem.templateType && !isPlaced) {
          const template = COMP_TEMPLATES.find(t => t.type === elem.templateType);
          if (template) { addComponent(template); setStatus(`Added: ${elem.name}`); }
        } else if (isPlaced) {
          const comp = state.components.find(c => c.type === elem.templateType);
          if (comp) { state.selectedIds = [comp.id]; renderAll(); }
        } else if (isNonBoard) {
          setStatus(`${elem.name}: located in ${displayType}`);
        } else {
          setStatus(`${elem.name}: no board template (${displayType})`);
        }
      });

      row.addEventListener('contextmenu', e => {
        e.preventDefault();
        showChecklistContextMenu(e.clientX, e.clientY, elem);
      });

      body.appendChild(row);
    }
  }
  updateChecklistStats();
}

function showChecklistContextMenu(x, y, elem) {
  const currentType = state.elementConfig[elem.id]?.displayType || elem.displayType;
  const items = [
    { label: `<b style="color:rgba(186,140,30,0.8)">${elem.name}</b>`, action: '' },
    { sep: true },
    { label: 'Display Type', submenu: DISPLAY_TYPES.map(dt => ({
      label: dt, active: dt === currentType,
      action: `hideContextMenu();setElementDisplayType('${elem.id}','${dt}')`
    }))},
    { sep: true },
  ];
  if (elem.templateType) {
    const isPlaced = isElementPlaced(elem);
    if (!isPlaced) {
      items.push({ label: 'Add to Board', action: `hideContextMenu();addElementToBoard('${elem.id}')` });
    } else {
      items.push({ label: 'Select on Board', action: `hideContextMenu();selectElement('${elem.id}')` });
      items.push({ label: 'Remove from Board', action: `hideContextMenu();removeElement('${elem.id}')`, danger: true });
    }
  }
  if (elem.openQ) {
    items.push({ sep: true });
    items.push({ label: `⚠ Open UX Question #${elem.openQ}`, action: '' });
  }
  showContextMenu(x, y, items);
}

function isElementPlaced(elem) {
  if (!elem.templateType) return false;
  return state.components.some(c => c.type === elem.templateType);
}

function setElementDisplayType(elemId, displayType) {
  if (!state.elementConfig[elemId]) state.elementConfig[elemId] = {};
  state.elementConfig[elemId].displayType = displayType;
  buildChecklist();
  setStatus(`${elemId}: set to ${displayType}`);
}

function addElementToBoard(elemId) {
  const elem = GAME_ELEMENTS.find(e => e.id === elemId);
  if (!elem || !elem.templateType) return;
  const template = COMP_TEMPLATES.find(t => t.type === elem.templateType);
  if (template) { addComponent(template); buildChecklist(); }
}

function selectElement(elemId) {
  const elem = GAME_ELEMENTS.find(e => e.id === elemId);
  if (!elem || !elem.templateType) return;
  const comp = state.components.find(c => c.type === elem.templateType);
  if (comp) { state.selectedIds = [comp.id]; renderAll(); }
}

function removeElement(elemId) {
  const elem = GAME_ELEMENTS.find(e => e.id === elemId);
  if (!elem || !elem.templateType) return;
  saveUndo();
  const comp = state.components.find(c => c.type === elem.templateType);
  if (comp) { deleteComp(comp.id); buildChecklist(); }
}

function updateChecklistStats() {
  const placed = GAME_ELEMENTS.filter(e => isElementPlaced(e)).length;
  const total = GAME_ELEMENTS.length;
  const el = document.getElementById('checklist-stats');
  if (el) el.textContent = `${placed}/${total} placed`;
}

function renderLayerPanel() {
  const list = document.getElementById('layers-list');
  list.innerHTML = '';
  state.layers.forEach(layer => {
    const layerComps = state.components.filter(c=>c.layer===layer.id);
    const allLayerDimmed = state.landscapeMode && layerComps.length > 0 && layerComps.every(c => !isCompLandscapeRelevant(c));
    const group = document.createElement('div');
    group.className = 'layer-group';
    const header = document.createElement('div');
    header.className = 'layer-header' + (allLayerDimmed ? ' landscape-grayed' : '');
    header.innerHTML = `
      <div class="layer-vis ${layer.visible?'':'hidden'}" onclick="toggleLayerVis('${layer.id}',event)">●</div>
      <div class="layer-dot" style="background:${layer.color};"></div>
      <div class="layer-name">${layer.name}</div>
      <div class="layer-caret">${layer.expanded?'▾':'▸'}</div>`;
    header.addEventListener('click', () => { layer.expanded=!layer.expanded; renderLayerPanel(); });
    group.appendChild(header);
    if (layer.expanded) {
      const items = document.createElement('div');
      items.className = 'layer-items';
      layerComps.forEach(comp => {
        const compDimmed = state.landscapeMode && !isCompLandscapeRelevant(comp);
        const row = document.createElement('div');
        row.className = 'comp-row' + (state.selectedIds.includes(comp.id)?' selected':'') + (compDimmed ? ' landscape-grayed' : '');
        const cGroup = getGroupForComp(comp.id);
        const groupBadge = cGroup ? `<span style="font-size:7px;color:rgba(186,140,30,0.5);margin-left:auto;flex-shrink:0;" title="${cGroup.name}">⚑</span>` : '';
        row.innerHTML = `<div class="comp-vis ${comp.visible?'':'hidden'}" onclick="toggleCompVis(${comp.id},event)">●</div><div class="comp-name">${comp.locked?'🔒 ':''}${comp.label}</div>${groupBadge}`;
        row.addEventListener('click', e => { if (e.target.classList.contains('comp-vis')) return; state.selectedIds=[comp.id]; renderAll(); });
        row.addEventListener('contextmenu', e => { e.preventDefault(); state.selectedIds=[comp.id]; renderAll(); showComponentContextMenu(e.clientX,e.clientY,comp); });
        items.appendChild(row);
      });
      group.appendChild(items);
    }
    list.appendChild(group);
  });
}

function toggleLayerVis(layerId, e) { e.stopPropagation(); const l=state.layers.find(l=>l.id===layerId); if(l){l.visible=!l.visible;renderAll();} }
function toggleCompVis(compId, e) { if(e)e.stopPropagation(); const c=state.components.find(c=>c.id===compId); if(c){c.visible=!c.visible;renderAll();} }

function renderDimensionsInfo(comp) {
  const bpx = boardPx();
  const pxW = (comp.w / 100 * bpx.w).toFixed(0);
  const pxH = (comp.h / 100 * bpx.h).toFixed(0);
  // True aspect ratio accounting for 16:9 board
  const ratioW = comp.w * 16, ratioH = comp.h * 9;
  const ar = ratioW / ratioH;
  // Simplify ratio for display
  const gcd = (a, b) => b < 0.01 ? a : gcd(b, a % b);
  const g = gcd(ratioW, ratioH);
  const rW = (ratioW / g).toFixed(1).replace(/\.0$/, '');
  const rH = (ratioH / g).toFixed(1).replace(/\.0$/, '');
  // Classify the ratio
  let ratioTag = '', ratioColor = 'rgba(255,255,255,0.3)';
  if (Math.abs(ar - 1) < 0.02) { ratioTag = 'SQUARE'; ratioColor = 'rgba(80,200,120,0.7)'; }
  else if (Math.abs(ar - 1.618) < 0.05 || Math.abs(ar - 0.618) < 0.03) { ratioTag = 'GOLDEN'; ratioColor = 'rgba(220,180,50,0.7)'; }
  else if (Math.abs(ar - 16/9) < 0.05 || Math.abs(ar - 9/16) < 0.03) { ratioTag = '16:9'; ratioColor = 'rgba(120,160,220,0.6)'; }
  else if (Math.abs(ar - 4/3) < 0.05 || Math.abs(ar - 3/4) < 0.03) { ratioTag = '4:3'; ratioColor = 'rgba(120,160,220,0.6)'; }
  else if (Math.abs(ar - 3/2) < 0.05 || Math.abs(ar - 2/3) < 0.03) { ratioTag = '3:2'; ratioColor = 'rgba(120,160,220,0.6)'; }
  // Visual ratio bar
  const barMax = 60;
  const barW = ar >= 1 ? barMax : Math.round(barMax * ar);
  const barH = ar <= 1 ? barMax : Math.round(barMax / ar);
  const id = comp.id;
  return `
    <div style="margin:5px 0 2px;padding:4px 6px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.06);border-radius:3px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
        <div style="width:${barW}px;height:${barH > 20 ? 20 : barH}px;border:1px solid rgba(186,140,30,0.4);border-radius:2px;background:rgba(186,140,30,0.08);flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-size:9px;color:rgba(255,255,255,0.5);">${pxW} × ${pxH} px</div>
          <div style="font-size:8px;color:${ratioColor};">${rW}:${rH} ${ratioTag ? '— ' + ratioTag : ''} ${ar >= 1 ? '(w)' : '(h)'}</div>
        </div>
      </div>
      <div style="display:flex;gap:3px;flex-wrap:wrap;">
        <button class="prop-btn" style="flex:1;min-width:0;margin:0;padding:2px 4px;font-size:7px;" onclick="saveUndo();makeCompRatio(${id},1,1)">1:1</button>
        <button class="prop-btn" style="flex:1;min-width:0;margin:0;padding:2px 4px;font-size:7px;" onclick="saveUndo();makeCompRatio(${id},1.618,1)">Golden W</button>
        <button class="prop-btn" style="flex:1;min-width:0;margin:0;padding:2px 4px;font-size:7px;" onclick="saveUndo();makeCompRatio(${id},1,1.618)">Golden H</button>
        <button class="prop-btn" style="flex:1;min-width:0;margin:0;padding:2px 4px;font-size:7px;" onclick="saveUndo();makeCompRatio(${id},4,3)">4:3</button>
        <button class="prop-btn" style="flex:1;min-width:0;margin:0;padding:2px 4px;font-size:7px;" onclick="saveUndo();makeCompRatio(${id},16,9)">16:9</button>
        <button class="prop-btn" style="flex:1;min-width:0;margin:0;padding:2px 4px;font-size:7px;" onclick="saveUndo();makeCompRatio(${id},3,2)">3:2</button>
      </div>
    </div>`;
}

// Set component to target aspect ratio, adjusting H to match W
// Accounts for 16:9 board: actual pixel ratio = (w% * boardW) / (h% * boardH)
function makeCompRatio(id, rw, rh) {
  const c = state.components.find(c => c.id === id);
  if (!c) return;
  const bpx = boardPx();
  const currentPxW = c.w / 100 * bpx.w;
  const targetPxH = currentPxW * rh / rw;
  c.h = targetPxH / bpx.h * 100;
  renderAll();
}

        ${VISUAL_TYPES.map(vt=>`<option value="${vt.id}" ${(comp.visualType||'zone')===vt.id?'selected':''}>${vt.label}</option>`).join('')}
      </select></div>
    <div class="prop-row"><div class="prop-label">COVER TYPE</div>
      <select class="prop-input" onchange="updateComp(${comp.id},'coverType',this.value)" size="1">
        <option value="opaque" ${(comp.coverType||'dynamic')==='opaque'?'selected':''}>&#9608; Opaque — hides landscape</option>
        <option value="dynamic" ${(comp.coverType||'dynamic')==='dynamic'?'selected':''}>&#9618; Dynamic — cards come &amp; go</option>
        <option value="translucent" ${(comp.coverType||'dynamic')==='translucent'?'selected':''}>&#9617; Translucent — see-through</option>
      </select></div>
    <div class="prop-row"><div class="prop-label">BG</div><input class="prop-input" value="${comp.bg}" onchange="updateComp(${comp.id},'bg',this.value)"></div>
    <div class="prop-row"><div class="prop-label">BORDER</div><input class="prop-input" value="${comp.border||''}" onchange="updateComp(${comp.id},'border',this.value)"></div>
    <div class="prop-row"><div class="prop-label">TEXT</div><input class="prop-input" value="${comp.color||''}" onchange="updateComp(${comp.id},'color',this.value)"></div>
    <div class="prop-row"><div class="prop-label">RADIUS</div><input class="prop-input" value="${comp.borderRadius||'4px'}" onchange="updateComp(${comp.id},'borderRadius',this.value)"></div>
    <div class="toggle-row"><input type="checkbox" ${comp.dashed?'checked':''} onchange="updateComp(${comp.id},'dashed',this.checked)"><span>Dashed</span></div>
  `;
}

function updateComp(id, key, val) { const c=state.components.find(c=>c.id===id); if(c){c[key]=val;renderAll();} }
function centerComp(id, axis) {
  const c = state.components.find(c => c.id === id);
  if (!c) return;
  if (axis === 'h') c.x = (100 - c.w) / 2;
  if (axis === 'v') c.y = (100 - c.h) / 2;
  renderAll();
}

function duplicateComp(id) { const c=state.components.find(c=>c.id===id); if(!c)return; saveUndo(); const nc={...c,id:state.nextId++,x:c.x+2,y:c.y+2}; state.components.push(nc); state.selectedIds=[nc.id]; renderAll(); }
function deleteComp(id) { state.components=state.components.filter(c=>c.id!==id); state.selectedIds=state.selectedIds.filter(i=>i!==id); state.groups.forEach(g=>{g.memberIds=g.memberIds.filter(m=>m!==id);}); state.groups=state.groups.filter(g=>g.memberIds.length>0); renderAll(); }
function deleteSelected() { saveUndo(); state.selectedIds.forEach(id=>{state.components=state.components.filter(c=>c.id!==id);}); state.selectedIds=[]; renderAll(); }
function bringForward(id) { const c=state.components.find(c=>c.id===id); if(c){c.zIndex=(c.zIndex||0)+1;renderAll();} }
function sendBackward(id) { const c=state.components.find(c=>c.id===id); if(c){c.zIndex=Math.max(0,(c.zIndex||0)-1);renderAll();} }
function selectAll(val) { state.selectedIds=val?state.components.map(c=>c.id):[]; renderAll(); }

function addComponent(template) {
  saveUndo();
  const comp = { ...template, id:state.nextId++, visible:true, zIndex:state.components.filter(c=>c.layer===template.layer).length,
    x:template.x+(Math.random()*4-2), y:template.y+(Math.random()*4-2), rotation:0, opacity:1, skewX:0, skewY:0 };

// ═══════════════════════════════════════════════════════════════
// ISOMETRIC — APPLY PERSPECTIVE TO ALL ZONES
// ═══════════════════════════════════════════════════════════════

function applyCameraPreset(preset) {
  saveUndo();
  const presets = {
    open:     { tiltX: 5,  tiltY: 0, zoom: 0.92, depth: 1400, horizonY: 28, vanishX: 50, vanishY: 28 },
    medium:   { tiltX: 14, tiltY: 0, zoom: 1.0,  depth: 1000, horizonY: 12, vanishX: 50, vanishY: 20 },
    enclosed: { tiltX: 22, tiltY: 0, zoom: 1.12, depth: 750,  horizonY: -10, vanishX: 50, vanishY: 40 },
    overhead: { tiltX: 32, tiltY: 0, zoom: 1.25, depth: 600,  horizonY: -50, vanishX: 50, vanishY: 50 },
  };
  const p = presets[preset];
  if (!p) return;
  state.boardTiltX = p.tiltX;
  state.boardTiltY = p.tiltY;
  state.boardZoom = p.zoom;
  state.perspectiveDepth = p.depth;
  state.horizonY = p.horizonY;
  state.vanishX = p.vanishX;
  state.vanishY = p.vanishY;
  applyBoardTilt();
  renderHorizonLine();
  renderVanishPoint();
  renderPropsPanel();
  setStatus('Camera preset: ' + preset);
}

function applyIsometricToAll() {
  const tx = state.boardTiltX || 0;
  if (tx === 0) { setStatus('Set a tilt angle first.'); return; }
  saveUndo();
  // Apply a proportional skewX to geography components ONLY
  // UI chrome (frame, interface, hand layers) stays fixed — never skewed
  const skewFactor = tx * 0.35;
  let count = 0;
  state.components.forEach(comp => {
    // Skip landscape backgrounds — they fill the board
    if (comp.type === 'terrain-bg' || comp.type === 'sky-bg') return;
    // Skip UI layers — borders, HUD, hand must not be affected by perspective
    if (UI_LAYERS.has(comp.layer)) return;
    comp.skewX = -skewFactor;
    // Apply slight vertical compression based on position
    // Objects higher on the board get slightly more foreshortening
    const verticalPos = comp.y / 100;
    comp.skewY = verticalPos * skewFactor * 0.15;
    count++;
  });
  renderAll();
  setStatus(`Applied isometric skew (${skewFactor.toFixed(1)}°) to ${count} geography zones (UI unchanged)`);
}

// ═══════════════════════════════════════════════════════════════
// ALIGNMENT
// ═══════════════════════════════════════════════════════════════

function alignSelected(mode) {
  if (state.selectedIds.length < 2) return;
  saveUndo();
  const comps = state.selectedIds.map(id=>state.components.find(c=>c.id===id)).filter(Boolean);
  if (mode==='left') { const m=Math.min(...comps.map(c=>c.x)); comps.forEach(c=>c.x=m); }
  else if (mode==='right') { const m=Math.max(...comps.map(c=>c.x+c.w)); comps.forEach(c=>c.x=m-c.w); }
  else if (mode==='centerH') { const a=comps.reduce((s,c)=>s+c.x+c.w/2,0)/comps.length; comps.forEach(c=>c.x=a-c.w/2); }
  else if (mode==='top') { const m=Math.min(...comps.map(c=>c.y)); comps.forEach(c=>c.y=m); }
  else if (mode==='bottom') { const m=Math.max(...comps.map(c=>c.y+c.h)); comps.forEach(c=>c.y=m-c.h); }
  else if (mode==='centerV') { const a=comps.reduce((s,c)=>s+c.y+c.h/2,0)/comps.length; comps.forEach(c=>c.y=a-c.h/2); }
  else if (mode==='distributeH') { comps.sort((a,b)=>a.x-b.x); const tg=comps[comps.length-1].x-comps[0].x-comps.slice(0,-1).reduce((s,c)=>s+c.w,0); const g=tg/(comps.length-1); let cur=comps[0].x+comps[0].w; for(let i=1;i<comps.length-1;i++){comps[i].x=cur+g;cur=comps[i].x+comps[i].w;} }
  else if (mode==='distributeV') { comps.sort((a,b)=>a.y-b.y); const tg=comps[comps.length-1].y-comps[0].y-comps.slice(0,-1).reduce((s,c)=>s+c.h,0); const g=tg/(comps.length-1); let cur=comps[0].y+comps[0].h; for(let i=1;i<comps.length-1;i++){comps[i].y=cur+g;cur=comps[i].y+comps[i].h;} }
  renderAll();
}

// GROUPS
// ═══════════════════════════════════════════════════════════════

function getGroupForComp(compId) {
  return state.groups.find(g => g.memberIds.includes(compId));
}

function selectGroup(groupId) {
  const group = state.groups.find(g => g.id === groupId);
  if (group) { state.selectedIds = [...group.memberIds]; renderAll(); }
}

function groupSelected() {
  if (state.selectedIds.length < 2) { setStatus('Select 2+ items to group.'); return; }
  saveUndo();
  // Remove selected items from any existing groups
  state.selectedIds.forEach(id => {
    state.groups.forEach(g => { g.memberIds = g.memberIds.filter(m => m !== id); });
  });
  // Clean up empty groups
  state.groups = state.groups.filter(g => g.memberIds.length > 0);
  // Create new group
  const group = { id: state.nextGroupId++, name: 'Group ' + (state.nextGroupId - 1), memberIds: [...state.selectedIds] };
  state.groups.push(group);
  renderAll();
  setStatus(`Grouped ${group.memberIds.length} items → ${group.name}`);
}

function ungroupSelected() {
  saveUndo();
  const groupsToRemove = new Set();
  state.selectedIds.forEach(id => {
    const g = getGroupForComp(id);
    if (g) groupsToRemove.add(g.id);
  });
  state.groups = state.groups.filter(g => !groupsToRemove.has(g.id));
  renderAll();
  setStatus('Ungrouped.');
}

function renameGroup(groupId) {
  const g = state.groups.find(g => g.id === groupId);
  if (!g) return;
  const name = prompt('Group name:', g.name);
  if (name) { g.name = name; renderAll(); }
}

function expandSelectionToGroups() {
  // When selecting a comp that's in a group, auto-select all group members
  const expanded = new Set(state.selectedIds);
  state.selectedIds.forEach(id => {
    const g = getGroupForComp(id);
    if (g) g.memberIds.forEach(m => expanded.add(m));
  });
  state.selectedIds = [...expanded];
}

// BURDENS
// ═══════════════════════════════════════════════════════════════

function setBurdens(val) {
  state.burdens = parseInt(val);
  const t = Math.min(state.burdens / 12, 1);

  document.querySelectorAll('.comp').forEach(el => {
    const id=parseInt(el.dataset.id), comp=state.components.find(c=>c.id===id);
    if (!comp) return;

    if (comp.type==='baradur') {
      // Store original position on first call
      if (!comp._baseX) { comp._baseX = comp.x; comp._baseY = comp.y; comp._baseW = comp.w; comp._baseH = comp.h; }

      // Camera progression: component grows and shifts as burden increases
      // Width: 4% → 22% of board (tower gets closer)
      // Height: 14% → 45% of board
      // X: drifts toward center as it grows
      // Y: stays anchored near top, grows downward
      comp.w = comp._baseW + t * 18;
      comp.h = comp._baseH + t * 31;
      comp.x = comp._baseX - t * 9; // drift left (toward center) as it grows
      comp.y = comp._baseY - t * 3;  // creep upward slightly

      // Reposition the DOM element
      const px = pctToPx(comp);
      el.style.left   = px.x + 'px';
      el.style.top    = px.y + 'px';
      el.style.width  = px.w + 'px';
      el.style.height = px.h + 'px';

      const inner=el.querySelector('.comp-inner');
      if(inner) inner.innerHTML=renderBaradur(comp);
    }
    if (comp.type==='twilight-pool') { const inner=el.querySelector('.comp-inner'); if(inner) inner.innerHTML=renderTwilightPool(comp); }
  });
}

function buildSaveData(name) {
  return JSON.stringify({ name: name || state.loadedLayoutName || 'untitled', components:state.components, layers:state.layers, boardRatio:state.boardRatio, nextId:state.nextId, horizonY:state.horizonY, elementConfig:state.elementConfig, boardTiltX:state.boardTiltX, boardTiltY:state.boardTiltY, perspectiveDepth:state.perspectiveDepth, vanishX:state.vanishX, vanishY:state.vanishY, boardZoom:state.boardZoom, groups:state.groups, nextGroupId:state.nextGroupId }, null, 2);
}

async function exportJSON() {
  const dataStr = buildSaveData();
  // If we have a file handle from Load, overwrite in place
  if (state.fileHandle) {
    try {
      const writable = await state.fileHandle.createWritable();
      await writable.write(dataStr);
      await writable.close();
      state.loadedLayoutData = JSON.parse(dataStr);
      setStatus('Saved: ' + state.loadedLayoutName);
      return;
    } catch(err) {
      // Permission denied or handle stale — fall through to download
      setStatus('Handle expired — downloading instead.');
    }
  }
  // Fallback: trigger download
  const filename = (state.loadedLayoutName || 'lotr_tcg_layout').replace(/[^a-zA-Z0-9_\-— ]/g,'') + '.json';
  const blob = new Blob([dataStr],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setStatus('Saved (downloaded): ' + filename);
}

async function exportJSONAs() {
  const name = prompt('Save layout as:', state.loadedLayoutName || 'my-layout');
  if (!name) return;
  state.loadedLayoutName = name;
  const dataStr = buildSaveData(name);
  state.loadedLayoutData = JSON.parse(dataStr);

  // Use File System Access API if available — pick a new file location
  if (window.showSaveFilePicker) {
    try {
      const saveOpts = {
        suggestedName: name.replace(/[^a-zA-Z0-9_\-— ]/g,'') + '.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      };
      if (state.lastDirHandle) saveOpts.startIn = state.lastDirHandle;
      const handle = await window.showSaveFilePicker(saveOpts);
      const writable = await handle.createWritable();
      await writable.write(dataStr);
      await writable.close();
      state.fileHandle = handle; // subsequent Saves go to this new file
      setStatus('Saved as: ' + name);
      return;
    } catch(err) {
      if (err.name === 'AbortError') return;
      setStatus('Save picker failed — downloading instead.');
    }
  }
  // Fallback: trigger download
  const filename = name.replace(/[^a-zA-Z0-9_\-— ]/g,'') + '.json';
  const blob = new Blob([dataStr],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setStatus('Saved as (downloaded): ' + filename);
}

// Legacy stub — redirects to new unified guide
function exportCompositionGuide(mode) { exportMJGuide(); }

function exportMJGuide() {
  const W = 1920, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const layoutName = state.loadedLayoutName || 'custom';

  // ── 1. BACKGROUND — neutral dark ──
  ctx.fillStyle = '#111114';
  ctx.fillRect(0, 0, W, H);

  // ── 2. UI MASK — smooth hull of all opaque UI elements ──
  // Collect bounding boxes of all visible opaque UI components
  const uiComps = state.components.filter(c =>
    c.visible && UI_LAYERS.has(c.layer) && c.coverType === 'opaque'
  );

  // Render UI mask: paint each UI element as a solid block, then blur
  // to create a smooth contour instead of blocky rectangles
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = W; maskCanvas.height = H;
  const mctx = maskCanvas.getContext('2d');
  mctx.fillStyle = '#000';
  mctx.fillRect(0, 0, W, H);

  // Draw UI regions in white on the mask
  mctx.fillStyle = '#fff';
  uiComps.forEach(c => {
    const x = c.x / 100 * W, y = c.y / 100 * H;
    const w = c.w / 100 * W, h = c.h / 100 * H;
    const rot = c.rotation || 0;
    mctx.save();
    if (rot) {
      mctx.translate(x + w / 2, y + h / 2);
      mctx.rotate(rot * Math.PI / 180);
      mctx.translate(-(x + w / 2), -(y + h / 2));
    }
    // Expand slightly for padding
    const pad = 8;
    if (c.shape === 'circle') {
      mctx.beginPath();
      mctx.ellipse(x + w / 2, y + h / 2, w / 2 + pad, h / 2 + pad, 0, 0, Math.PI * 2);
      mctx.fill();
    } else {
      mctx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    }
    mctx.restore();
  });

  // Blur the mask to smooth edges (simulate convex hull smoothing)
  mctx.filter = 'blur(18px)';
  mctx.drawImage(maskCanvas, 0, 0);
  mctx.filter = 'none';

  // Threshold: anything above 50% brightness becomes the mask
  const maskData = mctx.getImageData(0, 0, W, H);
  for (let i = 0; i < maskData.data.length; i += 4) {
    const v = maskData.data[i] > 100 ? 255 : 0;
    maskData.data[i] = maskData.data[i + 1] = maskData.data[i + 2] = v;
  }
  mctx.putImageData(maskData, 0, 0);

  // Blur again for final smooth contour
  mctx.filter = 'blur(6px)';
  mctx.drawImage(maskCanvas, 0, 0);
  mctx.filter = 'none';

  // Draw the mask onto main canvas as a semi-transparent dark overlay
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.drawImage(maskCanvas, 0, 0);
  ctx.globalAlpha = 1.0;
  ctx.restore();

  // Draw smooth contour line around the mask
  // Use edge detection on the mask to find the outline
  const edgeCanvas = document.createElement('canvas');
  edgeCanvas.width = W; edgeCanvas.height = H;
  const ectx = edgeCanvas.getContext('2d');
  const finalMask = mctx.getImageData(0, 0, W, H);
  const edgeData = ectx.createImageData(W, H);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const idx = (y * W + x) * 4;
      const c = finalMask.data[idx];
      const l = finalMask.data[idx - 4];
      const r = finalMask.data[idx + 4];
      const u = finalMask.data[(idx - W * 4)];
      const d = finalMask.data[(idx + W * 4)];
      if (c > 128 && (l < 128 || r < 128 || u < 128 || d < 128)) {
        edgeData.data[idx] = 140; edgeData.data[idx + 1] = 120;
        edgeData.data[idx + 2] = 60; edgeData.data[idx + 3] = 200;
      }
    }
  }
  ectx.putImageData(edgeData, 0, 0);
  // Soften the edge line
  ectx.filter = 'blur(1.5px)';
  ectx.drawImage(edgeCanvas, 0, 0);
  ectx.filter = 'none';
  ctx.drawImage(edgeCanvas, 0, 0);

  // ── 3. HORIZON LINE ──
  const horizPx = state.horizonY / 100 * H;
  if (state.horizonY >= -5 && state.horizonY <= 105) {
    ctx.strokeStyle = 'rgba(255,200,50,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 4]);
    ctx.beginPath(); ctx.moveTo(0, horizPx); ctx.lineTo(W, horizPx); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,200,50,0.45)';
    ctx.font = '11px Georgia';
    ctx.fillText('horizon', W - 80, horizPx - 5);
  }

  // ── 4. STAMP POSITIONS — from fellowship-zone and shadow-zone components ──
  // Stamps are the standee positions — small circles showing where flat ground is needed.
  // FP stamps = gold, SH stamps = purple.
  const fpComps = state.components.filter(c => c.type === 'fellowship-zone' && c.visible);
  const shComps = state.components.filter(c => c.type === 'shadow-zone' && c.visible);

  function drawStamp(ctx, xPct, yPct, color, fillColor, radius) {
    const px = xPct / 100 * W;
    const py = yPct / 100 * H;
    // Soft glow
    const grad = ctx.createRadialGradient(px, py, 0, px, py, radius * 2.5);
    grad.addColorStop(0, fillColor);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(px, py, radius * 2.5, 0, Math.PI * 2); ctx.fill();
    // Solid circle
    ctx.fillStyle = fillColor;
    ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.fill();
    // Border ring
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.stroke();
  }

  const stampR = 18; // pixels — roughly standee base width at 1920px

  // Draw FP stamps — gold
  fpComps.forEach(comp => {
    // Use the zone's center as a single stamp cluster anchor, then
    // generate a grid of stamps within the zone bounds
    const zx = comp.x, zy = comp.y, zw = comp.w, zh = comp.h;
    const stampSpacing = 7; // % between stamps
    const cols = Math.max(1, Math.floor(zw / stampSpacing));
    const rows = Math.max(1, Math.floor(zh / stampSpacing));
    for (let r = 0; r < rows && r < 4; r++) {
      for (let c = 0; c < cols && c < 4; c++) {
        // Stagger odd rows
        const ox = (r % 2) * (stampSpacing * 0.4);
        const sx = zx + stampSpacing * 0.5 + c * stampSpacing + ox;
        const sy = zy + stampSpacing * 0.5 + r * stampSpacing;
        if (sx < zx + zw && sy < zy + zh) {
          drawStamp(ctx, sx, sy, 'rgba(220,170,40,0.7)', 'rgba(220,170,40,0.12)', stampR);
        }
      }
    }
  });

  // Draw SH stamps — purple
  shComps.forEach(comp => {
    const zx = comp.x, zy = comp.y, zw = comp.w, zh = comp.h;
    const stampSpacing = 7;
    const cols = Math.max(1, Math.floor(zw / stampSpacing));
    const rows = Math.max(1, Math.floor(zh / stampSpacing));
    for (let r = 0; r < rows && r < 4; r++) {
      for (let c = 0; c < cols && c < 4; c++) {
        const ox = (r % 2) * (stampSpacing * 0.4);
        const sx = zx + stampSpacing * 0.5 + c * stampSpacing + ox;
        const sy = zy + stampSpacing * 0.5 + r * stampSpacing;
        if (sx < zx + zw && sy < zy + zh) {
          drawStamp(ctx, sx, sy, 'rgba(120,80,180,0.7)', 'rgba(120,80,180,0.12)', stampR);
        }
      }
    }
  });

  // ── 5. LABELS ──
  // "UI COVER" label on the mask area
  ctx.fillStyle = 'rgba(140,120,60,0.5)';
  ctx.font = '10px Georgia';
  ctx.fillText('UI COVER — featureless fill', 40, 22);

  // "FLAT SPOTS" near stamp clusters
  if (fpComps.length > 0) {
    const fc = fpComps[0];
    ctx.fillStyle = 'rgba(220,170,40,0.6)';
    ctx.font = '10px Georgia';
    ctx.fillText('FLAT GROUND (fellowship)', fc.x / 100 * W, (fc.y + fc.h) / 100 * H + 14);
  }
  if (shComps.length > 0) {
    const sc = shComps[0];
    ctx.fillStyle = 'rgba(120,80,180,0.6)';
    ctx.font = '10px Georgia';
    ctx.fillText('FLAT GROUND (shadow)', sc.x / 100 * W, (sc.y + sc.h) / 100 * H + 14);
  }

  // ── 6. LEGEND ──
  const legX = W - 280, legY = H - 100;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.beginPath(); ctx.roundRect(legX, legY, 264, 88, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.roundRect(legX, legY, 264, 88, 6); ctx.stroke();

  ctx.font = 'bold 10px Georgia';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('MJ COMPOSITION GUIDE', legX + 12, legY + 16);
  ctx.font = '10px Georgia';

  // Legend items
  const items = [
    ['rgba(140,120,60,0.6)', 'UI cover (featureless fill)'],
    ['rgba(220,170,40,0.7)', 'Flat ground — fellowship standees'],
    ['rgba(120,80,180,0.7)', 'Flat ground — shadow standees'],
    ['rgba(255,255,255,0.3)', 'Open — dramatic terrain features'],
  ];
  items.forEach(([col, label], i) => {
    ctx.fillStyle = col;
    if (i === 0) {
      ctx.fillRect(legX + 12, legY + 26 + i * 16, 10, 10);
    } else {
      ctx.beginPath(); ctx.arc(legX + 17, legY + 31 + i * 16, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(label, legX + 30, legY + 35 + i * 16);
  });

  // ── 7. LAYOUT NAME ──
  ctx.fillStyle = 'rgba(186,140,30,0.6)';
  ctx.font = 'bold 12px Georgia';
  ctx.fillText(layoutName, 40, H - 16);

  // ── EXPORT ──
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (layoutName || 'composition').replace(/[^a-zA-Z0-9_\-— ]/g, '') + '-mj-guide.png';
    a.click();
    setStatus('MJ composition guide exported.');
  });
}

function applyLoadedData(data, name) {
  if (data.components) state.components=data.components;
  if (data.layers) state.layers=data.layers;
  if (data.boardRatio) state.boardRatio=data.boardRatio;
  if (data.nextId) state.nextId=data.nextId;
  if (data.horizonY!==undefined) state.horizonY=data.horizonY;
  if (data.elementConfig) state.elementConfig=data.elementConfig;
  if (data.boardTiltX!==undefined) state.boardTiltX=data.boardTiltX;
  if (data.boardTiltY!==undefined) state.boardTiltY=data.boardTiltY;
  if (data.perspectiveDepth!==undefined) state.perspectiveDepth=data.perspectiveDepth;
  if (data.vanishX!==undefined) state.vanishX=data.vanishX;
  if (data.vanishY!==undefined) state.vanishY=data.vanishY;
  if (data.boardZoom!==undefined) state.boardZoom=data.boardZoom;
  state.groups = data.groups || [];
  state.nextGroupId = data.nextGroupId || (state.groups.length ? Math.max(...state.groups.map(g=>g.id)) + 1 : 1);
  state.loadedLayoutName = name;
  state.loadedLayoutData = JSON.parse(JSON.stringify(data));
  applyBoardTilt(); renderVanishPoint();
  buildChecklist(); renderAll(); setStatus('Layout loaded: ' + state.loadedLayoutName);
}

async function importJSON() {
  // Use File System Access API if available — gives us a handle for in-place save
  if (window.showOpenFilePicker) {
    try {
      const opts = {
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
        multiple: false,
      };
      // Recall the last-used directory so the picker opens where you left off
      if (state.lastDirHandle) opts.startIn = state.lastDirHandle;
      const [handle] = await window.showOpenFilePicker(opts);
      const file = await handle.getFile();
      const text = await file.text();
      const data = JSON.parse(text);
      state.fileHandle = handle;
      // Store the directory for next time (resolve parent is not available,
      // so we store the file handle itself — the picker remembers the folder)
      state.lastDirHandle = handle;
      applyLoadedData(data, data.name || file.name.replace('.json',''));
    } catch(err) {
      if (err.name !== 'AbortError') setStatus('Error loading: ' + err.message);
    }
  } else {
    // Fallback: classic file input
    const input=document.createElement('input'); input.type='file'; input.accept='.json';
    input.onchange = e => {
      const reader=new FileReader();
      reader.onload = ev => {
        try {
          const data=JSON.parse(ev.target.result);
          state.fileHandle = null; // no handle in fallback mode
          applyLoadedData(data, data.name || e.target.files[0].name.replace('.json',''));
        } catch(err) { setStatus('Error loading JSON.'); }
      };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  }
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
  setTimeout(()=>{ document.getElementById('status-msg').textContent='Right-click for options · Hover left edge for checklist'; }, 4000);
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', e => {
  const inInput = ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if ((e.metaKey||e.ctrlKey) && e.key==='z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.metaKey||e.ctrlKey) && (e.key==='y'||(e.key==='z'&&e.shiftKey))) { e.preventDefault(); redo(); return; }
  if ((e.metaKey||e.ctrlKey) && e.key==='d') { e.preventDefault(); if(state.selectedIds.length===1)duplicateComp(state.selectedIds[0]); return; }
  if ((e.metaKey||e.ctrlKey) && e.key==='a') { e.preventDefault(); selectAll(true); return; }
  if ((e.metaKey||e.ctrlKey) && e.key==='g' && !e.shiftKey) { e.preventDefault(); groupSelected(); return; }
  if ((e.metaKey||e.ctrlKey) && e.key==='g' && e.shiftKey) { e.preventDefault(); ungroupSelected(); return; }
  if (inInput) return;
  if ((e.key==='r' || e.key==='R') && !dragState) {
    if (state.selectedIds.length >= 1) {
      const deg = e.shiftKey ? -90 : 90;
      state.selectedIds.forEach(id => rotateComp90(id, deg));
    }
    return;
  }
  if (e.key==='Delete'||e.key==='Backspace') deleteSelected();
  if (e.key==='Escape') { if (document.body.classList.contains('full-view')) { exitFullView(); return; } selectAll(false); hideContextMenu(); hideMasterModal(); }
  // Tab = cycle through overlapping items at the selected item's position
  if (e.key==='Tab') {
    e.preventDefault();
    if (state.selectedIds.length === 1) {
      const cur = state.components.find(c => c.id === state.selectedIds[0]);
      if (cur) {
        // Find all components that overlap with the current selection's center
        const cx = cur.x + cur.w / 2;
        const cy = cur.y + cur.h / 2;
        const overlapping = state.components.filter(c =>
          c.visible && cx >= c.x && cx <= c.x + c.w && cy >= c.y && cy <= c.y + c.h
        );
        if (overlapping.length > 1) {
          const idx = overlapping.findIndex(c => c.id === cur.id);
          const next = overlapping[(idx + 1) % overlapping.length];
          state.selectedIds = [next.id];
          renderAll();
        }
      }
    }
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
    e.preventDefault();
    const d = e.shiftKey ? 0.5 : 0.1;
    state.selectedIds.forEach(id => {
      const c=state.components.find(c=>c.id===id); if(!c)return;
      if (e.key==='ArrowLeft') c.x=Math.max(0,c.x-d);
      if (e.key==='ArrowRight') c.x=Math.min(100-c.w,c.x+d);
      if (e.key==='ArrowUp') c.y=Math.max(0,c.y-d);
      if (e.key==='ArrowDown') c.y=Math.min(100-c.h,c.y+d);
    });
    renderAll();
  }
});

// ═══════════════════════════════════════════════════════════════
// DEFAULT LAYOUT
// ═══════════════════════════════════════════════════════════════

function loadDefault() {
  // If a layout was loaded from JSON, reset to that layout's saved state
  if (state.loadedLayoutData) {
    const data = state.loadedLayoutData;
    state.components = JSON.parse(JSON.stringify(data.components || []));
    state.groups = JSON.parse(JSON.stringify(data.groups || []));
    state.nextGroupId = data.nextGroupId || (state.groups.length ? Math.max(...state.groups.map(g=>g.id)) + 1 : 1);
    state.selectedIds = [];
    if (data.nextId) state.nextId = data.nextId;
    if (data.horizonY !== undefined) state.horizonY = data.horizonY;
    if (data.boardTiltX !== undefined) state.boardTiltX = data.boardTiltX;
    if (data.boardTiltY !== undefined) state.boardTiltY = data.boardTiltY;
    if (data.perspectiveDepth !== undefined) state.perspectiveDepth = data.perspectiveDepth;
    if (data.vanishX !== undefined) state.vanishX = data.vanishX;
    if (data.vanishY !== undefined) state.vanishY = data.vanishY;
    applyBoardTilt(); renderVanishPoint();
    renderAll(); buildChecklist();
    setStatus('Reset to: ' + (state.loadedLayoutName || 'loaded layout'));
    return;
  }
  // Otherwise use hardcoded default
  state.components=[]; state.selectedIds=[]; state.nextId=1; state.groups=[]; state.nextGroupId=1;
  const defaults = ['baradur','phase-jewel','shadow-zone','opp-hand','ring-spinner',
    'twilight-pool','adventure-hud','fellowship-zone','hand-fan','pass-btn','action-log','left-dock','right-dock',
    'fp-draw','fp-discard','fp-dead','sh-draw','sh-discard'];
  const overrides = {
    'hand-fan':{x:52,y:55,w:48,h:45},'pass-btn':{x:45,y:94,w:10,h:5},'shadow-zone':{x:1,y:8,w:98,h:11},
    'fellowship-zone':{x:1,y:38,w:98,h:18},
    'twilight-pool':{x:43,y:21,w:14,h:15},'adventure-hud':{x:7,y:1,w:10,h:5},'baradur':{x:93,y:1,w:4,h:10},
    'fp-draw':{x:91,y:44,w:4,h:6},'fp-discard':{x:96,y:44,w:4,h:6},'fp-dead':{x:91,y:51,w:4,h:6},
    'sh-draw':{x:91,y:9,w:4,h:6},'sh-discard':{x:96,y:9,w:4,h:6},
  };
  defaults.forEach(type => { const t=COMP_TEMPLATES.find(t=>t.type===type); if(t)addComponent({...t,...(overrides[type]||{})}); });
  state.selectedIds=[];
  renderAll();
  buildChecklist();
}

// ═══════════════════════════════════════════════════════════════
// INIT

buildChecklist();
initHorizonDrag();
resizeBoard();
// Editor opens empty — user loads a layout or starts fresh
window.addEventListener('resize', () => resizeBoard());

// Auto-load a layout via ?load=<path relative to this page>.
// Requires serving over http (fetch is blocked on file://). In-place save is
// unavailable for auto-loaded files — Save falls back to Save As.
(async function autoLoadFromURL() {
  const p = new URLSearchParams(location.search).get('load');
  if (!p) return;
  try {
    const res = await fetch(p);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const data = await res.json();
    state.fileHandle = null;
    applyLoadedData(data, data.name || decodeURIComponent(p.split('/').pop()).replace('.json', ''));
  } catch (err) {
    setStatus('Auto-load failed: ' + err.message);
  }
})();
